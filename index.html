async function saveProfile() {
    const firstName = document.getElementById('profileFirstName')?.value?.trim() || '';
    const lastName = document.getElementById('profileLastName')?.value?.trim() || '';
    const phone = document.getElementById('profilePhone')?.value?.trim() || '';
    const address = document.getElementById('profileAddress')?.value?.trim() || '';
    const city = document.getElementById('profileCity')?.value?.trim() || '';
    const state = document.getElementById('profileState')?.value?.trim() || '';
    const zip = document.getElementById('profileZip')?.value?.trim() || '';
    
    const name = `${firstName} ${lastName}`.trim();
    
    if (!name) { 
        toast('Name is required', 'error'); 
        return; 
    }
    
    try {
        // Update auth profile
        await Auth.updateProfile({ name, displayName: name });
        
        // Save extended profile to Firestore (do NOT include isMember - that's admin controlled)
        if (firebaseInitialized && Auth.currentUser) {
            await db.collection('users').doc(Auth.currentUser.uid).set({
                name,
                phone,
                address,
                city,
                state,
                zip,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
        }
        
        toast('Profile updated! ✓', 'success');
        render();
    } catch (e) {
        console.error('Error saving profile:', e);
        toast('Error saving profile', 'error');
    }
}

async function changePassword() {
    const currentPassword = document.getElementById('currentPassword')?.value || '';
    const newPassword = document.getElementById('newPassword')?.value || '';
    const confirmPassword = document.getElementById('confirmPassword')?.value || '';
    
    if (!currentPassword || !newPassword || !confirmPassword) {
        toast('Please fill in all password fields', 'error');
        return;
    }
    
    if (newPassword !== confirmPassword) {
        toast('New passwords do not match', 'error');
        return;
    }
    
    if (newPassword.length < 6) {
        toast('Password must be at least 6 characters', 'error');
        return;
    }
    
    try {
        const user = auth.currentUser;
        const credential = firebase.auth.EmailAuthProvider.credential(user.email, currentPassword);
        
        // Re-authenticate
        await user.reauthenticateWithCredential(credential);
        
        // Update password
        await user.updatePassword(newPassword);
        
        toast('Password updated successfully! ✓', 'success');
        
        // Clear fields
        document.getElementById('currentPassword').value = '';
        document.getElementById('newPassword').value = '';
        document.getElementById('confirmPassword').value = '';
    } catch (e) {
        console.error('Error changing password:', e);
        if (e.code === 'auth/wrong-password') {
            toast('Current password is incorrect', 'error');
        } else {
            toast('Error updating password: ' + e.message, 'error');
        }
    }
}

function saveUserPref(key, value) {
    const prefs = JSON.parse(localStorage.getItem('rooted_user_prefs') || '{}');
    prefs[key] = value;
    localStorage.setItem('rooted_user_prefs', JSON.stringify(prefs));
}

function toggleCustomColor(enabled) {
    saveUserPref('useCustomColor', enabled);
    if (!enabled) {
        saveUserPref('accentColor', '');
    }
    applyUserTheme();
    render();
}

function applyUserTheme() {
    const prefs = JSON.parse(localStorage.getItem('rooted_user_prefs') || '{}');
    const root = document.documentElement;
    
    // Get seasonal colors if set
    const seasonColors = {
        spring: { primary: '#f472b6', secondary: '#c084fc' },
        summer: { primary: '#f59e0b', secondary: '#fbbf24' },
        fall: { primary: '#ea580c', secondary: '#f97316' },
        winter: { primary: '#3b82f6', secondary: '#60a5fa' }
    };
    
    let primaryColor = '#16a34a'; // Default green
    let secondaryColor = '#22c55e';
    
    // Priority: User seasonal > User custom color > Church theme > Default
    if (prefs.seasonalTheme && seasonColors[prefs.seasonalTheme]) {
        primaryColor = seasonColors[prefs.seasonalTheme].primary;
        secondaryColor = seasonColors[prefs.seasonalTheme].secondary;
    } else if (prefs.useCustomColor && prefs.accentColor) {
        primaryColor = prefs.accentColor;
        secondaryColor = prefs.accentColor;
    } else if (prefs.useChurchTheme !== false) {
        const userChurchId = Auth.currentUser ? getUserChurch(Auth.currentUser.uid) : null;
        const userChurch = userChurchId ? getChurchData(userChurchId) : null;
        if (userChurch?.branding?.primaryColor) {
            primaryColor = userChurch.branding.primaryColor;
            secondaryColor = userChurch.branding.secondaryColor || primaryColor;
        }
    }
    
    root.style.setProperty('--root-green', primaryColor);
    root.style.setProperty('--leaf-green', secondaryColor);
}

// Apply theme on load
document.addEventListener('DOMContentLoaded', applyUserTheme);

function useMyLocation() {
    const results = document.getElementById('churchSearchResults');
    
    if (!navigator.geolocation) {
        toast('Geolocation is not supported by your browser', 'error');
        return;
    }
    
    results.innerHTML = `
        <div style="text-align:center;padding:var(--space-lg)">
            <div class="loading-spinner" style="margin:0 auto var(--space-md)"></div>
            <p style="color:var(--text-secondary)">Getting your location...</p>
        </div>
    `;
    
    navigator.geolocation.getCurrentPosition(
        async (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            
            // Get all churches and calculate distance
            const allChurches = await ChurchDB.getAllChurches();
            const withDistance = allChurches.map(church => {
                if (church.latitude && church.longitude) {
                    const dist = calculateDistance(lat, lng, church.latitude, church.longitude);
                    return { ...church, distance: dist };
                }
                return { ...church, distance: 999999 };
            }).sort((a, b) => a.distance - b.distance);
            
            displayChurchResults(withDistance, true);
        },
        (error) => {
            toast('Could not get your location: ' + error.message, 'error');
            results.innerHTML = '<p style="color:var(--error);text-align:center">Could not get your location. Please enter it manually.</p>';
        },
        { enableHighAccuracy: true }
    );
}

function calculateDistance(lat1, lng1, lat2, lng2) {
    // Haversine formula
    const R = 3959; // Earth's radius in miles
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLng/2) * Math.sin(dLng/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
}

function getUserStudyProgress(userId, studyId) {
    try {
        const key = `rooted_study_progress_${userId}_${studyId}`;
        return JSON.parse(localStorage.getItem(key) || 'null');
    } catch (e) {
        return null;
    }
}

function saveUserStudyProgress(userId, studyId, progress) {
    const key = `rooted_study_progress_${userId}_${studyId}`;
    localStorage.setItem(key, JSON.stringify(progress));
}

function enrollInStudy(studyId) {
    const userId = Auth.currentUser?.uid;
    if (!userId) return;
    
    const existing = getUserStudyProgress(userId, studyId);
    if (existing) {
        toast('You\'re already enrolled in this study!', 'info');
        return;
    }
    
    const progress = {
        studyId,
        enrolledAt: Date.now(),
        currentWeek: 0,
        completedWeeks: [],
        weekUnlockDates: {}
    };
    
    saveUserStudyProgress(userId, studyId, progress);
    toast('Enrolled! Week 1 is now available 📖', 'success');
    render();
}

function getNextUnlockDate(churchId, studyId, weekNum) {
    const church = getChurchData(churchId);
    const schedule = church?.studySchedules?.[studyId];
    
    if (!schedule) {
        // Default: 7 days after enrollment
        return null;
    }
    
    // Church has set a specific unlock day/time
    const unlockDay = schedule.unlockDay; // 0-6 (Sunday-Saturday)
    const unlockHour = schedule.unlockHour || 19; // Default 7 PM
    
    const now = new Date();
    let nextUnlock = new Date(now);
    
    // Find the next occurrence of the unlock day
    const daysUntilUnlock = (unlockDay - now.getDay() + 7) % 7 || 7;
    nextUnlock.setDate(now.getDate() + daysUntilUnlock * weekNum);
    nextUnlock.setHours(unlockHour, 0, 0, 0);
    
    return nextUnlock.getTime();
}

function isWeekUnlocked(userId, churchId, studyId, weekNum) {
    if (weekNum === 0) return true; // Week 1 always unlocked
    
    const progress = getUserStudyProgress(userId, studyId);
    if (!progress) return false;
    
    // Check if previous week is completed
    if (!progress.completedWeeks.includes(weekNum - 1)) return false;
    
    const church = getChurchData(churchId);
    const schedule = church?.studySchedules?.[studyId];
    
    if (schedule) {
        // Church has schedule - check if unlock time has passed
        const unlockTime = progress.weekUnlockDates?.[weekNum];
        if (unlockTime && Date.now() >= unlockTime) return true;
        if (!unlockTime) {
            // Calculate and save unlock time
            const unlockDate = getNextUnlockDate(churchId, studyId, 1);
            if (unlockDate) {
                progress.weekUnlockDates = progress.weekUnlockDates || {};
                progress.weekUnlockDates[weekNum] = unlockDate;
                saveUserStudyProgress(userId, studyId, progress);
            }
            return false;
        }
        return false;
    } else {
        // No schedule - 7 day wait
        const lastCompleted = progress.completedWeeks[progress.completedWeeks.length - 1];
        const completedAt = progress.weekCompletedAt?.[lastCompleted];
        if (completedAt && Date.now() >= completedAt + 7 * 24 * 60 * 60 * 1000) return true;
        return false;
    }
}

function formatTimeUntil(timestamp) {
    const diff = timestamp - Date.now();
    if (diff <= 0) return 'Now';
    
    const days = Math.floor(diff / (24 * 60 * 60 * 1000));
    const hours = Math.floor((diff % (24 * 60 * 60 * 1000)) / (60 * 60 * 1000));
    
    if (days > 0) return `${days}d ${hours}h`;
    return `${hours}h`;
}

function renderUserStudies() {
    const userId = Auth.currentUser?.uid;
    const churchId = userId ? getUserChurch(userId) : null;
    const church = churchId ? getChurchData(churchId) : null;
    const enabledStudies = church?.enabledStudies || [];
    
    // Get user's enrolled studies
    const enrolledStudies = ROOTED_STUDIES.filter(study => {
        return enabledStudies.includes(study.id) && getUserStudyProgress(userId, study.id);
    }).map(study => ({
        ...study,
        progress: getUserStudyProgress(userId, study.id)
    }));
    
    // Get available studies (enabled but not enrolled)
    const availableStudies = ROOTED_STUDIES.filter(study => {
        return enabledStudies.includes(study.id) && !getUserStudyProgress(userId, study.id);
    });
    
    // Get scheduled resources from church playlist
    const playlist = church?.resourcePlaylist || [];
    const now = Date.now();
    const viewedResources = JSON.parse(localStorage.getItem('rooted_viewed_resources') || '[]');
    
    // Available resources (unlocked)

    if (userChurches.length === 0) {

// Universal function to load church data and re-render current page
async function loadChurchDataAndRerender(churchId, expectedNav) {
    if (!churchId) return;
    
    try {
        // Force fresh data from Firebase
        const freshChurch = await ChurchDB.getChurchFresh(churchId);
        
        if (freshChurch) {
            // Update cache
            churchCache[churchId] = freshChurch;
            
            // Re-render if still on expected page
            if (State.current.activeNav === expectedNav) {
                render();
            }
        }
    } catch (e) {
        console.error('Error loading church data:', e);
    }
}

// Ensure church data is loaded for user pages
async function ensureChurchDataLoaded(churchId) {
    if (!churchId) return null;
    
    // If not in cache, load from Firebase
    if (!churchCache[churchId]) {
        try {
            const church = await ChurchDB.getChurchFresh(churchId);
            if (church) {
                churchCache[churchId] = church;
            }
            return church;
        } catch (e) {
            console.error('Error loading church:', e);
            return null;
        }
    }
    
    return churchCache[churchId];
}

function renderChurchVideosPage() {

            </div>

    }
    
    const cachedChurch = churchCache[userChurchId];
    
    if (!cachedChurch) {
        loadChurchDataAndRerender(userChurchId, 'church-videos');
        return `
        <div class="videos-page">
            <div class="videos-loading">
                <div class="loading-spinner"></div>
                <p>Loading videos...</p>
            </div>
        </div>`;
    }
    
    const allVideos = cachedChurch?.ytVideos || [];
    const allPlaylists = (cachedChurch?.ytPlaylists || []).filter(p => p.enabled !== false && p.name);
    const branding = cachedChurch?.branding || {};
    
    const videos = allVideos.filter(v => allPlaylists.find(p => p.id === v.playlistId));
    
    if (!videos.length) {
        return `

            </div>

    }
    
    // Pick a random video for the hero

// Continue Watching - localStorage functions
function getContinueWatching(churchId) {
    try {
        const history = JSON.parse(localStorage.getItem('rooted_watch_history') || '{}');
        return (history[churchId] || []).slice(0, 10);
    } catch (e) {
        return [];
    }
}

function addToWatchHistory(videoId, title, churchId) {
    try {
        const history = JSON.parse(localStorage.getItem('rooted_watch_history') || '{}');
        if (!history[churchId]) history[churchId] = [];
        
        // Remove if already exists
        history[churchId] = history[churchId].filter(h => h.videoId !== videoId);
        
        // Add to front
        history[churchId].unshift({
            videoId,
            title,
            timestamp: Date.now()
        });
        
        // Keep only last 20
        history[churchId] = history[churchId].slice(0, 20);
        
        localStorage.setItem('rooted_watch_history', JSON.stringify(history));
    } catch (e) {
        console.error('Error saving watch history:', e);
    }
}

// Save video progress when user stops watching
function saveVideoProgress(videoId, churchId, currentTime, duration) {
    try {
        const progress = JSON.parse(localStorage.getItem('rooted_video_progress') || '{}');
        if (!progress[churchId]) progress[churchId] = {};
        
        // Only save if watched more than 10 seconds and not near the end
        if (currentTime > 10 && currentTime < duration - 30) {
            progress[churchId][videoId] = {
                time: Math.floor(currentTime),
                duration: Math.floor(duration),
                savedAt: Date.now()
            };
        } else if (currentTime >= duration - 30) {
            // Near the end, remove progress (completed)
            delete progress[churchId][videoId];
        }
        
        localStorage.setItem('rooted_video_progress', JSON.stringify(progress));
    } catch (e) {
        console.error('Error saving video progress:', e);
    }
}

// Get saved progress for a video
function getVideoProgress(videoId, churchId) {
    try {
        const progress = JSON.parse(localStorage.getItem('rooted_video_progress') || '{}');
        const videoProgress = progress[churchId]?.[videoId];
        
        // Only return if saved within last 30 days
        if (videoProgress && Date.now() - videoProgress.savedAt < 30 * 24 * 60 * 60 * 1000) {
            return videoProgress;
        }
        return null;
    } catch (e) {
        return null;
    }
}

// Track current playing video for saving progress
let currentPlayingVideo = null;

function playAndTrackVideo(videoId, title, churchId) {
    addToWatchHistory(videoId, title, churchId);
    const progress = getVideoProgress(videoId, churchId);
    playYouTubeVideo(videoId, title, churchId, progress?.time || 0);
}

// Filter videos function
function filterVideos(filter) {
    document.querySelectorAll('.video-filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === filter);
    });
    
    document.querySelectorAll('.video-row').forEach(row => {
        if (filter === 'all') {
            row.style.display = '';
        } else if (filter.startsWith('playlist_')) {
            const playlistId = filter.replace('playlist_', '');
            row.style.display = (row.dataset.playlist === playlistId || row.dataset.playlist === 'continue') ? '' : 'none';
        }
    });
}

// Get seasonal colors based on church branding
function getSeasonalColors(branding) {
    const season = branding?.seasonalTheme;
    const seasonPalettes = {
        spring: { primary: '#f472b6', secondary: '#c084fc' },
        summer: { primary: '#f59e0b', secondary: '#fbbf24' },
        fall: { primary: '#ea580c', secondary: '#f97316' },
        winter: { primary: '#3b82f6', secondary: '#60a5fa' }
    };
    
    if (season && seasonPalettes[season]) {
        return seasonPalettes[season];
    }
    
    return {
        primary: branding?.primaryColor || '#16a34a',
        secondary: branding?.secondaryColor || '#22c55e'
    };
}

// Hero video rotation
let heroRotationInterval = null;
let currentHeroIndex = 0;

function startHeroRotation(churchId) {
    // Clear any existing interval
    if (heroRotationInterval) {
        clearInterval(heroRotationInterval);
    }
    
    const videosPage = document.querySelector('.videos-page');
    if (!videosPage) return;
    
    try {
        const videosData = JSON.parse(videosPage.dataset.videos || '[]');
        if (videosData.length <= 1) return;
        
        const cachedChurch = churchCache[churchId];
        const allPlaylists = (cachedChurch?.ytPlaylists || []).filter(p => p.enabled !== false && p.name);
        
        // Rotate every 30 seconds
        heroRotationInterval = setInterval(() => {
            // Only rotate if still on videos page
            if (State.current.activeNav !== 'church-videos') {
                clearInterval(heroRotationInterval);
                return;
            }
            
            // Pick next random video (different from current)
            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * videosData.length);
            } while (newIndex === currentHeroIndex && videosData.length > 1);
            
            currentHeroIndex = newIndex;
            const newVideo = videosData[newIndex];
            
            // Animate the transition
            const heroBg = document.getElementById('heroBackground');
            const heroTitle = document.getElementById('heroTitle');
            const heroMeta = document.getElementById('heroMeta');
            const heroPlayBtn = document.getElementById('heroPlayBtn');
            
            if (heroBg && heroTitle) {
                // Fade out
                heroBg.style.transition = 'opacity 0.5s';
                heroBg.style.opacity = '0';
                
                setTimeout(() => {
                    // Update content
                    heroBg.style.backgroundImage = `url('https://img.youtube.com/vi/${newVideo.videoId}/maxresdefault.jpg')`;
                    heroTitle.textContent = newVideo.title;
                    
                    const playlistName = allPlaylists.find(p => p.id === newVideo.playlistId)?.name || 'Video';
                    if (heroMeta) heroMeta.textContent = playlistName;
                    
                    if (heroPlayBtn) {
                        heroPlayBtn.onclick = () => playAndTrackVideo(newVideo.videoId, newVideo.title, churchId);
                    }
                    
                    // Fade in
                    heroBg.style.opacity = '1';
                }, 500);
            }
        }, 30000); // 30 seconds
        
    } catch (e) {
        console.error('Hero rotation error:', e);
    }
}

// Clean up rotation when navigating away
const originalNavigate = navigate;
navigate = function(nav) {
    if (nav !== 'church-videos' && heroRotationInterval) {
        clearInterval(heroRotationInterval);
        heroRotationInterval = null;
    }
    originalNavigate(nav);
};

// Play YouTube video in modal with resume support
function playYouTubeVideo(videoId, title, churchId = null, startTime = 0) {
    currentPlayingVideo = { videoId, title, churchId };
    
    // Build embed URL with start time
    let embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1&enablejsapi=1`;
    if (startTime > 0) {
        embedUrl += `&start=${startTime}`;
    }
    
    showModal(`
        <div class="modal" onclick="event.stopPropagation()" style="max-width:800px;width:95%">
            <div class="modal-header">
                <h3 class="modal-title">${title}</h3>
                <button class="modal-close" onclick="handleVideoClose()">✕</button>
            </div>
            <div class="modal-body" style="padding:0">
                ${startTime > 0 ? `<div style="background:var(--root-green);color:white;padding:8px 16px;font-size:0.85rem">▶️ Resuming from ${formatVideoTime(startTime)}</div>` : ''}
                <div style="position:relative;padding-bottom:56.25%;height:0">
                    <iframe id="ytPlayer" src="${embedUrl}" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0" allow="autoplay;encrypted-media" allowfullscreen></iframe>
                </div>
            </div>
        </div>
    `);
    
    // Try to track progress using YouTube API
    initYouTubeProgressTracking(videoId, churchId);
}

// Format seconds to mm:ss
function formatVideoTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${mins}:${secs.toString().padStart(2, '0')}`;
}

// Handle video close - save progress
function handleVideoClose() {
    // Try to get current time from iframe (may not work due to cross-origin)
    const iframe = document.getElementById('ytPlayer');
    if (iframe && currentPlayingVideo?.churchId) {
        // Use a polling approach or postMessage to get current time
        // For now, we'll save progress when they manually save
    }
    currentPlayingVideo = null;
    closeModal();
}

// Initialize YouTube progress tracking
function initYouTubeProgressTracking(videoId, churchId) {
    if (!churchId) return;
    
    // Poll for progress using postMessage (works with some limitations)
    let progressInterval = setInterval(() => {
        const iframe = document.getElementById('ytPlayer');
        if (!iframe || !document.querySelector('.modal')) {
            clearInterval(progressInterval);
            return;
        }
        
        // Try to get time via YouTube API (if player is ready)
        try {
            iframe.contentWindow.postMessage('{"event":"command","func":"getCurrentTime","args":""}', '*');
        } catch (e) {}
    }, 5000);
    
    // Listen for messages from YouTube
    const messageHandler = (event) => {
        if (event.origin !== 'https://www.youtube.com') return;
        try {
            const data = JSON.parse(event.data);
            if (data.info && typeof data.info.currentTime === 'number' && typeof data.info.duration === 'number') {
                saveVideoProgress(videoId, churchId, data.info.currentTime, data.info.duration);
            }
        } catch (e) {}
    };
    
    window.addEventListener('message', messageHandler);
    
    // Cleanup when modal closes
    const checkModal = setInterval(() => {
        if (!document.querySelector('.modal')) {
            clearInterval(progressInterval);
            clearInterval(checkModal);
            window.removeEventListener('message', messageHandler);
        }
    }, 1000);
}

async function exportUserData() {
    const data = await UserDB.getUserData(Auth.currentUser.uid);
    const exportData = { profile: Auth.currentUser, data: data, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `rooted-backup-${new Date().toISOString().split('T')[0]}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toast('Data exported!', 'success');
}

async function deleteAccount() {
    if (document.getElementById('deleteConfirm').value !== 'DELETE') {
        toast('Please type DELETE to confirm', 'error');
        return;
    }
    try {
        if (firebaseInitialized) {
            await db.collection('users').doc(Auth.currentUser.uid).delete();
            await auth.currentUser.delete();
        } else {
            const users = JSON.parse(localStorage.getItem('rooted_users') || '{}');
            delete users[Auth.currentUser.email];
            localStorage.setItem('rooted_users', JSON.stringify(users));

        await Auth.signOut();

        toast('Account deleted', 'info');
        State.set({ screen: 'welcome', user: null });

let quizState = { screen: 'start', qIndex: 0, answer: null, scores: {}, expanded: null };

function renderSeasonsTool() {
    return `<div style="min-height:100vh;background:linear-gradient(135deg,#1e293b,#0f172a,#1e293b)"><div style="max-width:600px;margin:0 auto;padding:20px"><button class="btn btn-ghost" onclick="backToTools()" style="margin-bottom:20px;color:#f59e0b">← Back to Growth Tools</button><div id="quizContent"></div></div><div id="printArea" style="display:none"></div></div>`;
}

function backToTools() { State.set({ screen: 'app', activeNav: 'tools' }); }

function initQuiz() {
    quizState = { screen: 'start', qIndex: 0, answer: null, scores: {}, expanded: null };
    renderQuiz();
}

function toggleExpand(section) {
    quizState.expanded = quizState.expanded === section ? null : section;
    renderQuiz();
}

function shareQuizApp() {
    if (navigator.share) {
        navigator.share({title:'Discover Your Season Quiz',text:'Find out which biblical character reflects your faith journey!',url:window.location.href});
    } else {
        navigator.clipboard.writeText(window.location.href);
        toast('Link copied! Share it with others.', 'success');
    }
}

function shareQuizStudy() {
    const sorted = Object.entries(quizState.scores).sort((a,b)=>b[1]-a[1]);
    const char = CHARACTERS[sorted[0][0]];
    const text = `My 7-Day Study Challenge: ${char.name} - ${char.title}\n\n${char.study.days.map(d=>`${d.d}: ${d.t}\nRead: ${d.p}\nReflect: ${d.q}`).join('\n\n')}\n\nMemory Verse: ${char.study.memoryVerse}\n\nKey Truth: ${char.study.keyTruth}\n\nFree Bible Tools:\n• BibleGateway.com\n• BlueLetter Bible.org\n• YouVersion.com\n• BibleHub.com`;
    if (navigator.share) {
        navigator.share({title:`${char.name} - 7-Day Study Challenge`,text:text});
    } else {
        navigator.clipboard.writeText(text);
        toast('Study guide copied!', 'success');
    }
}

function saveResultToNotes() {
    const sorted = Object.entries(quizState.scores).sort((a,b)=>b[1]-a[1]);
    const char = CHARACTERS[sorted[0][0]];
    
    const content = `🌱 My Season: ${char.name} - ${char.title}

${char.description}

📖 Key Scriptures:
${char.scriptures.map(s => `"${s.t}" — ${s.r}`).join('\n\n')}

🎯 Why I Match:
${char.whyMatch.map(w => `• ${w}`).join('\n')}

💡 Key Truth: ${char.study.keyTruth}

📝 Memory Verse: ${char.study.memoryVerse}`;
    
    saveToNotes(content, 'Seasons of Faith Quiz');
    toast('Saved to your notes! 📝', 'success');
}

function startQuiz() { quizState.screen = 'quiz'; renderQuiz(); }
function selectAnswer(i) { quizState.answer = i; renderQuiz(); }

function nextQuestion() {
    if (quizState.answer === null) return;
    const chars = QUESTIONS[quizState.qIndex].a[quizState.answer].chars;
    Object.entries(chars).forEach(([c, s]) => {
        quizState.scores[c] = (quizState.scores[c] || 0) + s;
    });
    if (quizState.qIndex < QUESTIONS.length - 1) {
        quizState.qIndex++;
        quizState.answer = null;
        renderQuiz();
    } else {
        quizState.screen = 'result';
        renderQuiz();
    }
}

// ========== INIT ==========
async function init() {
    document.body.dataset.theme = localStorage.getItem('rooted_theme') || 'dark';
    
    // Apply user's custom theme/colors
    applyUserTheme();
    
    initFirebase();
    State.subscribe(render);
    
    // Restore navigation state from localStorage/URL
    const restoredState = State.restoreNavState();
    const savedNav = restoredState?.activeNav || localStorage.getItem('rooted_nav');
    
    // Check URL hash for superadmin access
    if (window.location.hash === '#superadmin' || window.location.hash === '#/superadmin') {
        showSuperAdminLogin();
        State.set({ screen: 'welcome' });
        return;
    }
    
    // Check for saved church admin session first
    const churchAdminSession = localStorage.getItem('rooted_church_admin_session');
    if (churchAdminSession) {
        try {
            const session = JSON.parse(churchAdminSession);
            // Load church data to verify session is still valid
            const church = await ChurchDB.getChurch(session.churchId);
            if (church) {
                // Determine nav - prefer restored state for church admin
                let activeNav = savedNav || 'church-dashboard';
                // Make sure it's a valid church admin nav
                const validChurchNavs = ['church-dashboard', 'church-members', 'church-resources', 
                    'church-checkin-resources', 'church-announcements', 'church-youtube', 
                    'church-social', 'church-branding', 'church-membership', 'church-location', 'church-tools', 'church-fso', 'church-pulse'];
                if (!validChurchNavs.includes(activeNav)) {
                    activeNav = 'church-dashboard';
                }
                
                State.set({ 
                    screen: 'app', 
                    accountType: 'church',
                    user: { name: church.name, email: 'admin@' + session.churchId, churchId: session.churchId, adminUsername: session.username },
                    activeNav: activeNav
                });
                localStorage.removeItem('rooted_nav');
                
                // Check for auto-push scheduled resources
                checkAndAutoPushResources(session.churchId);
                
                return;
            } else {
                // Invalid session, clear it
                localStorage.removeItem('rooted_church_admin_session');
            }
        } catch (e) {
            console.log('Error restoring church admin session:', e);
            localStorage.removeItem('rooted_church_admin_session');
        }
    }
    
    // Check for regular user session
    const user = await Auth.init();
    if (user) {
        // CRITICAL: Load user's church connections
        await loadUserChurchData();
        
        // Determine nav - prefer restored state for regular user
        let activeNav = savedNav || 'dashboard';
        // Make sure it's a valid user nav
        const validUserNavs = ['dashboard', 'my-church', 'church-videos', 'tools', 'progress', 'profile', 'settings', 'studies'];
        if (!validUserNavs.includes(activeNav)) {
            activeNav = 'dashboard';
        }
        
        localStorage.removeItem('rooted_nav');
        State.set({ screen: 'app', user, activeNav });
    } else {
        State.set({ screen: 'welcome' });
    }
}

async function pulseLoadConversations(churchId, isAdmin) {
    const container = document.getElementById('pulseList');
    if (!container) return;
    
    // Detach previous inbox listener
    pulseDetachInboxListener();
    
    try {
        if (!firebaseInitialized) {
            pulseConversations = JSON.parse(localStorage.getItem('pulse_convos_' + churchId) || '[]');
            pulseRenderConvoList(container, isAdmin);
            return;
        }
        
        const userId = isAdmin ? 'admin_' + churchId : Auth.currentUser?.uid;
        if (!userId) { pulseConversations = []; pulseRenderConvoList(container, isAdmin); return; }
        
        if (isAdmin) {
            // Admin: real-time listener on all church conversations
            try {
                _pulseInboxListener = db.collection('pulse_conversations').where('churchId','==',churchId).limit(50)
                    .onSnapshot(snap => {
                        pulseConversations = snap.docs.map(d => ({id:d.id,...d.data()}));
                        pulseConversations.sort((a,b) => {
                            const at = a.lastMessageAt?.toMillis?.() || a.lastMessageAt || 0;
                            const bt = b.lastMessageAt?.toMillis?.() || b.lastMessageAt || 0;
                            return bt - at;
                        });
                        const c = document.getElementById('pulseList');
                        if (c) pulseRenderConvoList(c, true);
                    }, err => {
                        console.log('Admin inbox listener error:', err.message);
                        // Fallback to one-time get
                        pulseLoadConvosFallback(churchId, isAdmin, container);
                    });
            } catch(e) { pulseLoadConvosFallback(churchId, isAdmin, container); }
        } else {
            // User: listen on conversations where they're a participant
            try {
                _pulseInboxListener = db.collection('pulse_conversations').where('participants','array-contains',userId).limit(50)
                    .onSnapshot(async snap => {
                        let dmDocs = snap.docs.filter(d => d.data().churchId === churchId);
                        
                        // Also get broadcasts (one-time, not listener)
                        let bcDocs = [];
                        try {
                            const bcSnap = await db.collection('pulse_conversations').where('churchId','==',churchId).where('type','==','broadcast').limit(50).get();
                            bcDocs = bcSnap.docs;
                        } catch(e) {
                            try {
                                const allSnap = await db.collection('pulse_conversations').where('churchId','==',churchId).limit(50).get();
                                bcDocs = allSnap.docs.filter(d => d.data().type === 'broadcast');
                            } catch(e2) {}
                        }
                        
                        // Merge and dedup
                        const seen = new Set();
                        const allDocs = [...dmDocs, ...bcDocs].filter(d => {
                            if (seen.has(d.id)) return false;
                            seen.add(d.id); return true;
                        });
                        
                        pulseConversations = allDocs.map(d => ({id:d.id,...d.data()}));
                        pulseConversations.sort((a,b) => {
                            const at = a.lastMessageAt?.toMillis?.() || a.lastMessageAt || 0;
                            const bt = b.lastMessageAt?.toMillis?.() || b.lastMessageAt || 0;
                            return bt - at;
                        });
                        const c = document.getElementById('pulseList');
                        if (c) pulseRenderConvoList(c, false);
                    }, err => {
                        console.log('User inbox listener error:', err.message);
                        pulseLoadConvosFallback(churchId, isAdmin, container);
                    });
            } catch(e) { pulseLoadConvosFallback(churchId, isAdmin, container); }
        }
    } catch(e) {
        console.error('Pulse conversations error:', e);
        pulseConversations = [];
        pulseRenderConvoList(container, isAdmin);
    }
}

// Fallback one-time load when listeners fail
async function pulseLoadConvosFallback(churchId, isAdmin, container) {
    try {
        const userId = isAdmin ? 'admin_' + churchId : Auth.currentUser?.uid;
        let docs = [];
        if (isAdmin) {
            const snap = await db.collection('pulse_conversations').where('churchId','==',churchId).limit(50).get();
            docs = snap.docs;
        } else {
            const dmSnap = await db.collection('pulse_conversations').where('participants','array-contains',userId).limit(50).get();
            docs = dmSnap.docs.filter(d => d.data().churchId === churchId);
            try {
                const bcSnap = await db.collection('pulse_conversations').where('churchId','==',churchId).limit(50).get();
                const bcDocs = bcSnap.docs.filter(d => d.data().type === 'broadcast');
                const seen = new Set(docs.map(d => d.id));
                for (const bd of bcDocs) { if (!seen.has(bd.id)) docs.push(bd); }
            } catch(e) {}
        }
        pulseConversations = docs.map(d => ({id:d.id,...d.data()}));
        pulseConversations.sort((a,b) => {
            const at = a.lastMessageAt?.toMillis?.() || a.lastMessageAt || 0;
            const bt = b.lastMessageAt?.toMillis?.() || b.lastMessageAt || 0;
            return bt - at;
        });
    } catch(e) { pulseConversations = []; }
    if (container) pulseRenderConvoList(container, isAdmin);
}

function pulseRenderConvoList(container, isAdmin) {
    if (!pulseConversations.length) {
        container.innerHTML = `<div style="text-align:center;padding:40px;color:var(--text-tertiary)">
            <div style="font-size:2.5rem;margin-bottom:12px">💬</div>
            <p style="margin:0 0 8px;font-weight:500">No messages yet</p>
            <p style="margin:0;font-size:0.85rem">${isAdmin ? 'Send a broadcast to get started' : 'Go to Find People to start a conversation'}</p>
        </div>`;
        return;
    }
    
    // Get my identity for name filtering
    const myId = isAdmin ? 'admin_' + pulseGetChurchId() : Auth.currentUser?.uid;
    const myName = isAdmin ? (State.current.user?.name || '') : (Auth.currentUser?.name || '');
    
    container.innerHTML = '<div style="display:grid;gap:8px">' + pulseConversations.map(c => {
        const timeStr = c.lastMessageAt?.toMillis ? getRelativeTime(c.lastMessageAt.toMillis()) : c.lastMessageAt ? getRelativeTime(c.lastMessageAt) : '';
        const isBc = c.type === 'broadcast';
        
        // Look up the actual church name from the stored churchId
        const churchObj = getChurchData(c.churchId);
        const churchName = c.churchName || churchObj?.name || State.current.user?.name || 'Church';
        
        // Title logic:
        // Broadcast → always show church name as title (subject goes in subtitle)
        // DM from admin to user → user sees church name
        // DM between users → show the other person's name
        let title;
        let subtitle = c.lastMessage || 'No messages yet';
        
        if (isBc) {
            // Broadcast: church name is the title, subject becomes part of subtitle
            title = churchName;
            if (c.title) subtitle = c.title + (c.lastMessage ? ' — ' + c.lastMessage : '');
        } else {
            // DM - figure out who the other person is
            const adminPrefix = 'admin_';
            const otherIdx = c.participants?.findIndex(p => p !== myId);
            const otherParticipant = otherIdx >= 0 ? c.participants[otherIdx] : null;
            const otherNameFromArr = otherIdx >= 0 ? c.participantNames?.[otherIdx] : null;
            
            if (!isAdmin && otherParticipant?.startsWith(adminPrefix)) {
                // User is viewing a DM from admin → show church name
                title = churchName;
            } else if (isAdmin && otherParticipant && !otherParticipant.startsWith(adminPrefix)) {
                // Admin is viewing a DM with a user → show user name
                title = otherNameFromArr || 'User';
            } else {
                title = otherNameFromArr || c.participantNames?.filter(n => n !== myName).join(', ') || 'Message';
            }
        }
        
        const icon = isBc ? '📣' : '💬';
        const grad = isBc ? '#8b5cf6,#a78bfa' : '#3b82f6,#60a5fa';
        
        return '<div onclick="pulseOpenConvo(\'' + c.id + '\')" style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card-bg);border-radius:var(--radius-md);cursor:pointer;transition:all 0.15s;border:1px solid var(--border-color)" onmouseover="this.style.background=\'var(--hover-bg)\'" onmouseout="this.style.background=\'var(--card-bg)\'">' +
            '<div style="width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,' + grad + ');display:flex;align-items:center;justify-content:center;color:white;font-size:1.1rem;flex-shrink:0">' + icon + '</div>' +
            '<div style="flex:1;min-width:0">' +
                '<div style="display:flex;justify-content:space-between;align-items:center"><strong style="font-size:0.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + title + '</strong><span style="font-size:0.7rem;color:var(--text-tertiary);flex-shrink:0;margin-left:8px">' + timeStr + '</span></div>' +
                '<p style="margin:2px 0 0;font-size:0.8rem;color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + subtitle + '</p>' +
            '</div>' +
        '</div>';
    }).join('') + '</div>';
}

async function pulseLoadPeople(churchId) {
    const container = document.getElementById('pulsePeopleList');
    if (!container) return;
    
    // Load connections in parallel
    await pulseLoadConnections(churchId);
    
    if (!firebaseInitialized) {
        container.innerHTML = '<p style="text-align:center;color:var(--text-tertiary);padding:20px">Firebase required to find people.</p>';
        return;
    }
    
    try {
        let allDocs = [];
        
        // Primary query: users with this church in their churches array
        try {
            const snap = await db.collection('users').where('churches','array-contains',churchId).get();
            if (!snap.empty) allDocs = [...snap.docs];
        } catch(e) { console.log('People query 1:', e.message); }
        
        // Fallback: members subcollection
        if (allDocs.length === 0) {
            try {
                const memSnap = await db.collection('churches').doc(churchId).collection('members').get();
                for (const memDoc of memSnap.docs) {
                    try {
                        const uDoc = await db.collection('users').doc(memDoc.id).get();
                        if (uDoc.exists) allDocs.push(uDoc);
                    } catch(e) {}
                }
            } catch(e) { console.log('People query 2:', e.message); }
        }
        
        const myUid = Auth.currentUser?.uid;
        const myDoc = allDocs.find(d => d.id === myUid);
        const myIsMember = myDoc?.data()?.isMember || false;
        
        pulseBodyMembers = allDocs.filter(d => d.id !== myUid).map(d => {
            const u = d.data();
            const name = u.profile?.name || u.name || u.displayName || 'User';
            const parts = name.trim().split(' ');
            return {
                id: d.id,
                name: name,
                firstName: parts[0] || '',
                lastName: parts.length > 1 ? parts.slice(1).join(' ') : '',
                profilePhoto: u.profilePhoto || u.profile?.photoURL || '',
                isMember: u.isMember || false,
                lastLogin: u.lastLogin?.toMillis?.() || u.lastLogin || null,
                visibility: u.pulsePrivacy?.visibility || 'everyone',
                allowMessages: u.pulsePrivacy?.allowMessages || 'everyone'
            };
        }).filter(m => {
            // Privacy filter
            if (m.visibility === 'hidden') return false;
            if (m.visibility === 'members_only' && !myIsMember) return false;
            return true;
        }).sort((a, b) => (a.firstName || '').localeCompare(b.firstName || ''));
        
        pulseRenderPeople(container);
    } catch(e) {
        console.error('Load people error:', e);
        container.innerHTML = '<p style="text-align:center;color:var(--text-tertiary);padding:20px">Unable to load members.</p>';
    }
}

function pulseFilterPeople(term) {
    pulseBodySearch = term.toLowerCase().trim();
    const c = document.getElementById('pulsePeopleList');
    if (c) pulseRenderPeople(c);
}

function pulseRenderPeople(container) {
    let people = [...pulseBodyMembers];
    if (pulseBodySearch) {
        people = people.filter(m => (m.firstName + ' ' + m.lastName).toLowerCase().includes(pulseBodySearch));
    }
    
    if (!people.length) {
        container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-tertiary)">' +
            '<div style="font-size:2.5rem;margin-bottom:12px">🤝</div>' +
            '<p style="margin:0">' + (pulseBodySearch ? 'No one found matching "' + pulseBodySearch + '"' : 'No church members found yet') + '</p></div>';
        return;
    }
    
    container.innerHTML = '<div style="display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">' +
    people.map(m => {
        const initials = getInitials(m);
        const hasPhoto = m.profilePhoto && m.profilePhoto.length > 5;
        const online = m.lastLogin && (Date.now() - m.lastLogin) < 24 * 60 * 60 * 1000;
        const connStatus = pulseGetConnectionStatus(m.id);
        const canMsg = m.allowMessages === 'everyone' || connStatus === 'accepted';
        const safeName = (m.firstName + ' ' + m.lastName).replace(/'/g, "\\'");
        
        let actionBtn;
        if (canMsg) {
            actionBtn = '<button class="btn btn-primary btn-sm" onclick="event.stopPropagation();pulseStartDM(\'' + m.id + '\',\'' + safeName + '\')" style="font-size:0.75rem">Message</button>';
        } else if (connStatus === 'pending_sent') {
            actionBtn = '<button class="btn btn-ghost btn-sm" disabled style="font-size:0.75rem;opacity:0.6">Pending</button>';
        } else if (connStatus === 'pending_received') {
            actionBtn = '<button class="btn btn-primary btn-sm" onclick="event.stopPropagation();pulseRespondConnByUser(\'' + m.id + '\',\'accepted\')" style="font-size:0.75rem">Accept</button>';
        } else {
            actionBtn = '<button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();pulseSendConnRequest(\'' + m.id + '\',\'' + safeName + '\')" style="font-size:0.75rem">Connect</button>';
        }
        
        const avatarHTML = hasPhoto
            ? '<img src="' + m.profilePhoto + '" style="width:48px;height:48px;border-radius:50%;object-fit:cover">'
            : '<div style="width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,' + (m.isMember ? 'var(--root-green),var(--leaf-green)' : '#3b82f6,#60a5fa') + ');display:flex;align-items:center;justify-content:center;color:white;font-weight:600">' + initials + '</div>';
        
        return '<div class="card" style="padding:14px;cursor:pointer;transition:all 0.15s" onclick="pulseShowProfile(\'' + m.id + '\')" onmouseover="this.style.transform=\'translateY(-2px)\'" onmouseout="this.style.transform=\'none\'">' +
            '<div style="display:flex;align-items:center;gap:12px">' +
                '<div style="position:relative">' + avatarHTML +
                    (online ? '<div style="position:absolute;bottom:0;right:0;width:12px;height:12px;background:#22c55e;border-radius:50%;border:2px solid var(--card-bg)"></div>' : '') +
                '</div>' +
                '<div style="flex:1;min-width:0">' +
                    '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">' +
                        '<strong style="font-size:0.95rem">' + m.firstName + ' ' + m.lastName + '</strong>' +
                        (m.isMember ? '<span style="background:#22c55e;color:white;font-size:0.5rem;padding:1px 5px;border-radius:6px">Member</span>' : '') +
                        (connStatus === 'accepted' ? '<span style="background:#3b82f6;color:white;font-size:0.5rem;padding:1px 5px;border-radius:6px">Connected</span>' : '') +
                    '</div>' +
                    '<p style="margin:2px 0 0;font-size:0.75rem;color:var(--text-tertiary)">' + (online ? 'Active now' : m.lastLogin ? 'Last seen ' + getRelativeTime(m.lastLogin) : '') + '</p>' +
                '</div>' +
                actionBtn +
            '</div>' +
        '</div>';
    }).join('') + '</div>';
}

function pulseShowProfile(userId) {
    const m = pulseBodyMembers.find(x => x.id === userId);
    if (!m) return;
    const initials = getInitials(m);
    const hasPhoto = m.profilePhoto && m.profilePhoto.length > 5;
    const connStatus = pulseGetConnectionStatus(m.id);
    const canMsg = m.allowMessages === 'everyone' || connStatus === 'accepted';
    const safeName = (m.firstName + ' ' + m.lastName).replace(/'/g, "\\'");
    
    let actionBtns;
    if (canMsg) {
        actionBtns = `<button class="btn btn-primary" onclick="closeModal();pulseStartDM('${m.id}','${safeName}')">Send Message</button>`;
    } else if (connStatus === 'pending_sent') {
        actionBtns = `<button class="btn btn-ghost" disabled>Connection Pending</button>`;
    } else if (connStatus === 'pending_received') {
        actionBtns = `<button class="btn btn-primary" onclick="pulseRespondConnByUser('${m.id}','accepted');closeModal();">Accept Connection</button>`;
    } else {
        actionBtns = `<button class="btn btn-secondary" onclick="pulseSendConnRequest('${m.id}','${safeName}');closeModal();">Connect</button>`;
    }
    
    showModal(`<div class="modal" onclick="event.stopPropagation()" style="max-width:400px">
        <div style="text-align:center;padding:24px 24px 0">
            ${hasPhoto ? `<img src="${m.profilePhoto}" style="width:80px;height:80px;border-radius:50%;object-fit:cover;margin-bottom:12px">` : `<div style="width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--root-green),var(--leaf-green));display:flex;align-items:center;justify-content:center;color:white;font-size:1.8rem;font-weight:700;margin:0 auto 12px">${initials}</div>`}
            <h3 style="margin:0">${m.firstName} ${m.lastName}</h3>
            <div style="margin-top:8px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap">
                ${m.isMember ? '<span style="background:#22c55e;color:white;font-size:0.7rem;padding:2px 8px;border-radius:8px">Church Member</span>' : ''}
                ${connStatus === 'accepted' ? '<span style="background:#3b82f6;color:white;font-size:0.7rem;padding:2px 8px;border-radius:8px">Connected</span>' : ''}
            </div>
        </div>
        <div style="padding:20px 24px 24px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
            ${actionBtns}
            <button class="btn btn-ghost" onclick="closeModal()">Close</button>
        </div>
    </div>`);
}

// Active real-time listener references
let _pulseConvoListener = null;
let _pulseInboxListener = null;
let _pulseCurrentConvoId = null;

function pulseDetachMsgListener() {
    if (_pulseConvoListener) { _pulseConvoListener(); _pulseConvoListener = null; }
    _pulseCurrentConvoId = null;
}

function pulseDetachInboxListener() {
    if (_pulseInboxListener) { _pulseInboxListener(); _pulseInboxListener = null; }
}

async function pulseOpenConvo(convoId) {
    // Detach previous listener if switching conversations
    pulseDetachMsgListener();
    _pulseCurrentConvoId = convoId;
    
    const convo = pulseConversations.find(c => c.id === convoId);
    if (!convo) return;
    
    const isAdmin = State.current.accountType === 'church';
    const myId = isAdmin ? 'admin_' + pulseGetChurchId() : Auth.currentUser?.uid;
    const myName = isAdmin ? (State.current.user?.name || '') : (Auth.currentUser?.name || '');
    const isBc = convo.type === 'broadcast';
    
    // Title logic - same as inbox
    let title;
    if (isBc && !isAdmin) {
        title = convo.churchName || convo.senderName || 'Church';
        if (convo.title) title += ': ' + convo.title;
    } else if (isBc && isAdmin) {
        title = convo.title || 'Broadcast';
    } else {
        const otherName = convo.participantNames?.find((n, i) => convo.participants?.[i] !== myId)
            || convo.participantNames?.filter(n => n !== myName).join(', ')
            || 'Conversation';
        title = otherName;
    }
    
    // Render the conversation shell immediately
    showModal(`<div class="modal" onclick="event.stopPropagation()" style="max-width:600px;height:80vh;display:flex;flex-direction:column;padding:0">
        <div style="padding:16px 20px;border-bottom:1px solid var(--border-color);display:flex;align-items:center;gap:12px">
            <button onclick="closeModal()" style="background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--text-primary)">←</button>
            <div style="flex:1">
                <strong>${title}</strong>
                <p style="margin:0;font-size:0.75rem;color:var(--text-tertiary)">${isBc ? 'Broadcast' : 'Direct Message'}</p>
            </div>
        </div>
        <div id="pulseMessages" style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px">
            <div style="text-align:center;padding:20px;color:var(--text-tertiary)">
                <div class="loading-spinner" style="width:24px;height:24px;margin:0 auto 8px"></div>
                <p style="margin:0;font-size:0.85rem">Loading messages...</p>
            </div>
        </div>
        <div style="padding:12px 16px;border-top:1px solid var(--border-color);display:flex;gap:8px;align-items:flex-end">
            <label style="cursor:pointer;font-size:1.2rem;padding:4px" title="Attach image">📎<input type="file" accept="image/*" style="display:none" onchange="pulseSendImage(this,'${convoId}')"></label>
            <textarea id="pulseInput" class="input-field" style="flex:1;margin:0;resize:none;min-height:40px;max-height:100px" placeholder="Type a message..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();pulseSendMsg('${convoId}');}"></textarea>
            <button class="btn btn-primary btn-sm" onclick="pulseSendMsg('${convoId}')">Send</button>
        </div>
    </div>`);
    
    // Attach real-time listener for messages
    if (firebaseInitialized) {
        try {
            const msgsRef = db.collection('pulse_conversations').doc(convoId).collection('messages').orderBy('timestamp','asc').limit(200);
            _pulseConvoListener = msgsRef.onSnapshot(snapshot => {
                // Only update if this is still the active conversation
                if (_pulseCurrentConvoId !== convoId) return;
                const container = document.getElementById('pulseMessages');
                if (!container) return;
                
                const messages = snapshot.docs.map(d => ({id:d.id,...d.data()}));
                
                if (!messages.length) {
                    container.innerHTML = '<p style="text-align:center;color:var(--text-tertiary);margin:auto">Start the conversation!</p>';
                    return;
                }
                
                const wasAtBottom = container.scrollTop >= container.scrollHeight - container.clientHeight - 50;
                
                container.innerHTML = messages.map(m => {
                    const isMe = m.senderId === myId;
                    const t = m.timestamp?.toMillis ? new Date(m.timestamp.toMillis()).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}) : m.timestamp ? new Date(m.timestamp).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}) : '';
                    return '<div style="display:flex;justify-content:' + (isMe?'flex-end':'flex-start') + '">' +
                        '<div style="max-width:80%;padding:10px 14px;border-radius:16px;' + (isMe?'background:var(--primary);color:white;border-bottom-right-radius:4px':'background:var(--hover-bg);border-bottom-left-radius:4px') + '">' +
                        (!isMe ? '<div style="font-size:0.7rem;font-weight:600;margin-bottom:4px;opacity:0.7">' + (m.senderName||'Unknown') + '</div>' : '') +
                        (m.imageUrl ? '<img src="' + m.imageUrl + '" style="max-width:100%;border-radius:8px;margin-bottom:6px;cursor:pointer" onclick="window.open(\'' + m.imageUrl + '\',\'_blank\')">' : '') +
                        (m.text ? '<div style="font-size:0.9rem">' + m.text + '</div>' : '') +
                        (t ? '<div style="font-size:0.6rem;opacity:0.6;margin-top:4px;text-align:right">' + t + '</div>' : '') +
                        '</div></div>';
                }).join('');
                
                // Auto-scroll to bottom if user was near bottom (or first load)
                if (wasAtBottom || !container.dataset.loaded) {
                    container.scrollTop = container.scrollHeight;
                    container.dataset.loaded = 'true';
                }
            }, err => {
                console.error('Message listener error:', err);
                // Fallback: try without orderBy
                const fallbackRef = db.collection('pulse_conversations').doc(convoId).collection('messages').limit(200);
                _pulseConvoListener = fallbackRef.onSnapshot(snap => {
                    if (_pulseCurrentConvoId !== convoId) return;
                    const container = document.getElementById('pulseMessages');
                    if (!container) return;
                    const messages = snap.docs.map(d => ({id:d.id,...d.data()}));
                    messages.sort((a,b) => {
                        const at = a.timestamp?.toMillis?.() || a.timestamp || 0;
                        const bt = b.timestamp?.toMillis?.() || b.timestamp || 0;
                        return at - bt;
                    });
                    // Same render logic
                    if (!messages.length) { container.innerHTML = '<p style="text-align:center;color:var(--text-tertiary);margin:auto">Start the conversation!</p>'; return; }
                    container.innerHTML = messages.map(m => {
                        const isMe = m.senderId === myId;
                        const t = m.timestamp?.toMillis ? new Date(m.timestamp.toMillis()).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}) : m.timestamp ? new Date(m.timestamp).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}) : '';
                        return '<div style="display:flex;justify-content:' + (isMe?'flex-end':'flex-start') + '"><div style="max-width:80%;padding:10px 14px;border-radius:16px;' + (isMe?'background:var(--primary);color:white;border-bottom-right-radius:4px':'background:var(--hover-bg);border-bottom-left-radius:4px') + '">' +
                            (!isMe ? '<div style="font-size:0.7rem;font-weight:600;margin-bottom:4px;opacity:0.7">' + (m.senderName||'Unknown') + '</div>' : '') +
                            (m.imageUrl ? '<img src="' + m.imageUrl + '" style="max-width:100%;border-radius:8px;margin-bottom:6px">' : '') +
                            (m.text ? '<div style="font-size:0.9rem">' + m.text + '</div>' : '') +
                            (t ? '<div style="font-size:0.6rem;opacity:0.6;margin-top:4px;text-align:right">' + t + '</div>' : '') +
                            '</div></div>';
                    }).join('');
                    container.scrollTop = container.scrollHeight;
                });
            });
        } catch(e) {
            console.error('Listener setup error:', e);
            // Ultimate fallback: one-time get
            const snap = await db.collection('pulse_conversations').doc(convoId).collection('messages').limit(200).get();
            const messages = snap.docs.map(d => ({id:d.id,...d.data()}));
            messages.sort((a,b) => (a.timestamp?.toMillis?.() || a.timestamp || 0) - (b.timestamp?.toMillis?.() || b.timestamp || 0));
            const container = document.getElementById('pulseMessages');
            if (container) {
                container.innerHTML = messages.map(m => {
                    const isMe = m.senderId === myId;
                    const t = m.timestamp?.toMillis ? new Date(m.timestamp.toMillis()).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}) : '';
                    return '<div style="display:flex;justify-content:' + (isMe?'flex-end':'flex-start') + '"><div style="max-width:80%;padding:10px 14px;border-radius:16px;' + (isMe?'background:var(--primary);color:white;border-bottom-right-radius:4px':'background:var(--hover-bg);border-bottom-left-radius:4px') + '">' +
                        (m.text ? '<div style="font-size:0.9rem">' + m.text + '</div>' : '') +
                        '</div></div>';
                }).join('') || '<p style="text-align:center;color:var(--text-tertiary);margin:auto">Start the conversation!</p>';
                container.scrollTop = container.scrollHeight;
            }
        }
    } else {
        // localStorage fallback - no real-time
        const messages = JSON.parse(localStorage.getItem('pulse_msgs_' + convoId) || '[]');
        const container = document.getElementById('pulseMessages');
        if (container) {
            container.innerHTML = messages.length ? messages.map(m => {
                const isMe = m.senderId === myId;
                return '<div style="display:flex;justify-content:' + (isMe?'flex-end':'flex-start') + '"><div style="max-width:80%;padding:10px 14px;border-radius:16px;' + (isMe?'background:var(--primary);color:white;border-bottom-right-radius:4px':'background:var(--hover-bg);border-bottom-left-radius:4px') + '">' +
                    (m.text ? '<div style="font-size:0.9rem">' + m.text + '</div>' : '') + '</div></div>';
            }).join('') : '<p style="text-align:center;color:var(--text-tertiary);margin:auto">Start the conversation!</p>';
            container.scrollTop = container.scrollHeight;
        }
    }
}

async function pulseSendMsg(convoId) {
    const input = document.getElementById('pulseInput');
    if (!input || !input.value.trim()) return;
    const text = input.value.trim(); input.value = '';
    // Refocus the input for rapid typing
    input.focus();
    const isAdmin = State.current.accountType === 'church';
    const myId = isAdmin ? 'admin_' + pulseGetChurchId() : Auth.currentUser?.uid;
    const myName = isAdmin ? (State.current.user?.name || 'Church Admin') : (Auth.currentUser?.name || 'User');
    const msg = { senderId: myId, senderName: myName, text, timestamp: firebaseInitialized ? firebase.firestore.FieldValue.serverTimestamp() : Date.now(), type: 'text' };
    
    if (firebaseInitialized) {
        try {
            // Just write — the onSnapshot listener handles displaying
            await db.collection('pulse_conversations').doc(convoId).collection('messages').add(msg);
            await db.collection('pulse_conversations').doc(convoId).set({ lastMessage: text.substring(0,100), lastMessageAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
        } catch(e) { toast('Failed to send','error'); }
    } else {
        const msgs = JSON.parse(localStorage.getItem('pulse_msgs_'+convoId)||'[]');
        msg.timestamp = Date.now(); msgs.push(msg);
        localStorage.setItem('pulse_msgs_'+convoId, JSON.stringify(msgs));
        // No listener in localStorage mode, manually reopen
        pulseOpenConvo(convoId);
    }
}

async function pulseSendImage(input, convoId) {
    const file = input.files?.[0]; if(!file) return;
    const isAdmin = State.current.accountType === 'church';
    const myId = isAdmin ? 'admin_' + pulseGetChurchId() : Auth.currentUser?.uid;
    const myName = isAdmin ? (State.current.user?.name || 'Church Admin') : (Auth.currentUser?.name || 'User');
    showUploadOverlay('Sending image...', 0, 1);
    try {
        let url = '';
        if (firebaseInitialized && firebase.storage) {
            const ref = firebase.storage().ref('pulse-images/' + pulseGetChurchId() + '/' + Date.now() + '_' + file.name);
            await ref.put(file); url = await ref.getDownloadURL();
        } else { url = URL.createObjectURL(file); }
        const msg = { senderId: myId, senderName: myName, text: '', imageUrl: url, timestamp: firebaseInitialized ? firebase.firestore.FieldValue.serverTimestamp() : Date.now(), type: 'image' };
        if (firebaseInitialized) {
            // Just write — the onSnapshot listener handles the display
            await db.collection('pulse_conversations').doc(convoId).collection('messages').add(msg);
            await db.collection('pulse_conversations').doc(convoId).set({ lastMessage: '📷 Image', lastMessageAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
        } else {
            const msgs = JSON.parse(localStorage.getItem('pulse_msgs_'+convoId)||'[]');
            msg.timestamp = Date.now(); msgs.push(msg);
            localStorage.setItem('pulse_msgs_'+convoId, JSON.stringify(msgs));
            pulseOpenConvo(convoId);
        }
        hideUploadOverlay();
    } catch(e) { hideUploadOverlay(); toast('Failed to send image','error'); }
}

// ==========================================
// PULSE BROADCASTS
// ==========================================

function showBroadcastModal(audience) {
    const labels = {all:'Everyone',members:'Members Only',nonmembers:'Non-Members',checkedin:'Checked-In Attendees'};
    showModal(`<div class="modal" onclick="event.stopPropagation()" style="max-width:500px">
        <div class="modal-header" style="background:linear-gradient(135deg,#8b5cf6,#a78bfa);color:white;margin:-24px -24px 0;padding:20px 24px;border-radius:var(--radius-lg) var(--radius-lg) 0 0">
            <h3 class="modal-title" style="margin:0">Broadcast to ${labels[audience]}</h3>
            <button class="modal-close" onclick="closeModal()" style="color:white">✕</button>
        </div>
        <div class="modal-body" style="padding-top:20px">
            <input type="text" id="bcTitle" class="input-field" placeholder="Subject (optional)" style="margin-bottom:12px">
            <textarea id="bcMessage" class="input-field" rows="5" placeholder="Type your message..." style="resize:vertical"></textarea>
            <div style="display:flex;gap:12px;margin-top:16px">
                <button class="btn btn-primary" style="flex:1" onclick="pulseSendBroadcast('${audience}')">Send</button>
                <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>`);
}

async function pulseSendBroadcast(audience) {
    const title = document.getElementById('bcTitle')?.value?.trim() || 'Church Announcement';
    const message = document.getElementById('bcMessage')?.value?.trim();
    if (!message) { toast('Please enter a message','error'); return; }
    const churchId = pulseGetChurchId();
    const adminId = 'admin_' + churchId;
    const churchName = State.current.user?.name || 'Church';
    const convo = {
        churchId, type: 'broadcast', audience,
        title: title,
        churchName: churchName,
        senderName: churchName,
        lastMessage: message.substring(0,100),
        lastMessageAt: firebaseInitialized ? firebase.firestore.FieldValue.serverTimestamp() : Date.now(),
        createdBy: adminId,
        participants: [adminId]
    };
    
    if (firebaseInitialized) {
        try {
            const ref = await db.collection('pulse_conversations').add(convo);
            await ref.collection('messages').add({
                senderId: adminId, senderName: State.current.user?.name || 'Church Admin',
                text: message,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                type: 'text'
            });
        } catch(e) { toast('Failed to send','error'); return; }
    } else {
        const id = 'bc_' + Date.now(); convo.id = id; convo.lastMessageAt = Date.now();
        const s = JSON.parse(localStorage.getItem('pulse_convos_' + churchId) || '[]');
        s.unshift(convo);
        localStorage.setItem('pulse_convos_' + churchId, JSON.stringify(s));
        localStorage.setItem('pulse_msgs_' + id, JSON.stringify([{senderId: adminId, senderName: State.current.user?.name || 'Church Admin', text: message, timestamp: Date.now(), type:'text'}]));
    }
    closeModal(); toast('Broadcast sent!','success'); navigate('church-pulse');
}

// ==========================================
// PULSE DIRECT MESSAGING
// ==========================================

async function pulseStartDM(userId, userName) {
    const churchId = pulseGetChurchId();
    const isAdmin = State.current.accountType === 'church';
    const myId = isAdmin ? 'admin_' + churchId : Auth.currentUser?.uid;
    
    // Check message permissions (admin bypasses)
    if (!isAdmin) {
        const target = pulseBodyMembers.find(m => m.id === userId);
        if (target?.allowMessages === 'nobody') { toast('This person is not accepting messages','info'); return; }
        if (target?.allowMessages === 'connections_only') {
            const connected = pulseConnections.some(c => c.status === 'accepted' && (c.fromId === userId || c.toId === userId));
            if (!connected) { toast('Connect with this person first','info'); return; }
        }
    }
    
    // Check for existing conversation
    let existingId = null;
    if (firebaseInitialized) {
        try {
            const snap = await db.collection('pulse_conversations').where('participants','array-contains',myId).limit(100).get();
            const found = snap.docs.find(d => {
                const data = d.data();
                return data.churchId === churchId && data.type === 'direct' && data.participants?.includes(userId);
            });
            if (found) existingId = found.id;
        } catch(e) { console.log('DM existing check:', e.message); }
    }
    
    if (existingId) { closeModal(); pulseOpenConvo(existingId); return; }
    
    // Create new conversation
    const myName = isAdmin ? (State.current.user?.name || 'Church Admin') : (Auth.currentUser?.name || 'User');
    const churchData = getChurchData(churchId);
    const convo = {
        churchId, type: 'direct',
        participants: [myId, userId],
        participantNames: [myName, userName],
        churchName: churchData?.name || State.current.user?.name || '',
        lastMessage: '', lastMessageAt: firebaseInitialized ? firebase.firestore.FieldValue.serverTimestamp() : Date.now(),
        createdBy: myId
    };
    
    let convoId;
    if (firebaseInitialized) {
        try { const ref = await db.collection('pulse_conversations').add(convo); convoId = ref.id; }
        catch(e) { toast('Failed to start conversation','error'); return; }
    } else {
        convoId = 'dm_' + Date.now(); convo.id = convoId; convo.lastMessageAt = Date.now();
        const s = JSON.parse(localStorage.getItem('pulse_convos_' + churchId) || '[]');
        s.unshift(convo);
        localStorage.setItem('pulse_convos_' + churchId, JSON.stringify(s));
    }
    closeModal(); pulseOpenConvo(convoId);
}

// ==========================================
// PULSE CONNECTIONS
// ==========================================

async function pulseLoadConnections(churchId) {
    if (!firebaseInitialized) { pulseConnections = []; pulsePendingRequests = []; return; }
    const myId = Auth.currentUser?.uid;
    if (!myId) { pulseConnections = []; pulsePendingRequests = []; return; }
    
    try {
        let snap1 = { docs: [] }, snap2 = { docs: [] };
        try {
            snap1 = await db.collection('pulse_connections').where('fromId','==',myId).get();
            snap2 = await db.collection('pulse_connections').where('toId','==',myId).get();
        } catch(e) { console.log('Connections load fallback:', e.message); }
        
        const all = [...snap1.docs.map(d => ({id:d.id,...d.data()})), ...snap2.docs.map(d => ({id:d.id,...d.data()}))];
        pulseConnections = all.filter(c => c.churchId === churchId);
        pulsePendingRequests = pulseConnections.filter(c => c.status === 'pending');
    } catch(e) { console.error('Connections error:', e); pulseConnections = []; pulsePendingRequests = []; }
}

function pulseGetConnectionStatus(userId) {
    const myId = Auth.currentUser?.uid;
    const conn = pulseConnections.find(c => (c.fromId === userId && c.toId === myId) || (c.toId === userId && c.fromId === myId));
    if (!conn) return 'none';
    if (conn.status === 'accepted') return 'accepted';
    if (conn.status === 'pending' && conn.fromId === myId) return 'pending_sent';
    if (conn.status === 'pending' && conn.toId === myId) return 'pending_received';
    return 'none';
}

async function pulseSendConnRequest(toId, toName) {
    const churchId = pulseGetChurchId();
    const myId = Auth.currentUser?.uid;
    const myName = Auth.currentUser?.name || 'User';
    if (!firebaseInitialized) { toast('Requires Firebase','error'); return; }
    
    const existing = pulseConnections.find(c => c.fromId === toId || c.toId === toId);
    if (existing) { toast('Connection already exists','info'); return; }
    
    try {
        await db.collection('pulse_connections').add({
            churchId, fromId: myId, fromName: myName, toId, toName,
            status: 'pending',
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        toast('Connection request sent!','success');
        await pulseLoadConnections(churchId);
        const c = document.getElementById('pulsePeopleList');
        if (c) pulseRenderPeople(c);
    } catch(e) { toast('Failed to send request','error'); }
}

async function pulseRespondConn(connectionId, response) {
    if (!firebaseInitialized) return;
    try {
        await db.collection('pulse_connections').doc(connectionId).update({
            status: response,
            respondedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        toast(response === 'accepted' ? 'Connected!' : 'Request declined','success');
        await pulseLoadConnections(pulseGetChurchId());
        navigate('pulse');
    } catch(e) { toast('Failed to respond','error'); }
}

async function pulseRespondConnByUser(userId, response) {
    const conn = pulseConnections.find(c => c.fromId === userId && c.toId === Auth.currentUser?.uid && c.status === 'pending');
    if (conn) await pulseRespondConn(conn.id, response);
}

// ==========================================
// PULSE PRIVACY
// ==========================================

async function pulseLoadPrivacy() {
    if (!firebaseInitialized) return;
    const uid = Auth.currentUser?.uid;
    if (!uid) return;
    try {
        const doc = await db.collection('users').doc(uid).get();
        if (doc.exists) {
            pulsePrivacy = doc.data().pulsePrivacy || { visibility: 'everyone', allowMessages: 'everyone' };
        }
    } catch(e) {}
}

async function pulseSetPrivacy(field, value) {
    pulsePrivacy[field] = value;
    if (!firebaseInitialized) { toast('Privacy updated','success'); navigate('pulse'); return; }
    try {
        await db.collection('users').doc(Auth.currentUser?.uid).set({
            ['pulsePrivacy']: pulsePrivacy
        }, { merge: true });
        toast('Privacy updated','success');
        navigate('pulse');
    } catch(e) { toast('Failed to save','error'); }
}

async function uploadProfilePhoto(input) {
    const file = input.files?.[0]; if(!file || !file.type.startsWith('image/')) { toast('Please select an image','error'); return; }
    showUploadOverlay('Uploading photo...',0,1);
    try {
        let url = ''; const uid = Auth.currentUser?.uid;
        if (firebaseInitialized && firebase.storage) {
            const ref = firebase.storage().ref(`profile-photos/${uid}.jpg`);
            await ref.put(file); url = await ref.getDownloadURL();
            await db.collection('users').doc(uid).update({ profilePhoto: url, 'profile.photoURL': url });
        } else { url = URL.createObjectURL(file); localStorage.setItem('profile_photo_'+uid, url); }
        if (Auth.currentUser) { Auth.currentUser.photoURL = url; localStorage.setItem('rooted_user', JSON.stringify(Auth.currentUser)); }
        hideUploadOverlay(); toast('Profile photo updated!','success'); renderApp();
    } catch(e) { hideUploadOverlay(); toast('Failed to upload photo','error'); }
}
