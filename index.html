    <style>
/* ========== CSS RESET & VARIABLES ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
    --root-green: #2d5a47; --root-green-light: #3d7a5f; --root-green-dark: #1e3d30;
    --leaf-green: #7cb083; --leaf-light: #a8d4af;
    --earth-brown: #8b7355; --earth-light: #c4a77d;
    --cream: #faf8f5; --cream-dark: #f0ebe3;
    --slate-900: #1a1a2e; --slate-800: #252538; --slate-700: #3d3d56;
    --slate-600: #5a5a78; --slate-500: #7a7a96; --slate-400: #9e9eb8;
    --slate-300: #c4c4d4; --slate-200: #e2e2ec; --slate-100: #f4f4f8;
    --success: #22c55e; --warning: #f59e0b; --error: #ef4444; --info: #3b82f6;
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'DM Sans', -apple-system, sans-serif;
    --space-xs: 4px; --space-sm: 8px; --space-md: 16px; --space-lg: 24px;
    --space-xl: 32px; --space-2xl: 48px; --space-3xl: 64px;
    --sidebar-width: 280px; --header-height: 64px; --max-content: 900px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.05); --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    --shadow-lg: 0 12px 40px rgba(0,0,0,0.12);
    --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-xl: 24px;
    --transition: 0.2s ease;
}

[data-theme="dark"] {
    --bg-primary: var(--slate-900); --bg-secondary: var(--slate-800); --bg-tertiary: var(--slate-700);
    --text-primary: var(--cream); --text-secondary: var(--slate-300); --text-tertiary: var(--slate-400);
    --border-color: rgba(255,255,255,0.1); --card-bg: rgba(255,255,255,0.05); --hover-bg: rgba(255,255,255,0.08);
}
[data-theme="light"] {
    --bg-primary: var(--cream); --bg-secondary: white; --bg-tertiary: var(--cream-dark);
    --text-primary: var(--slate-900); --text-secondary: var(--slate-600); --text-tertiary: var(--slate-500);
    --border-color: rgba(0,0,0,0.08); --card-bg: white; --hover-bg: rgba(0,0,0,0.03);
}

html { font-size: 16px; scroll-behavior: smooth; overflow-x: hidden; }
body { font-family: var(--font-body); background: var(--bg-primary); color: var(--text-primary); line-height: 1.6; min-height: 100vh; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 500; line-height: 1.3; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, textarea, select { font-family: inherit; }

/* Animations */
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
@keyframes spin { to { transform: rotate(360deg); } }
.fade-up { animation: fadeUp 0.4s ease; }
.fade-in { animation: fadeIn 0.3s ease; }

/* Layout */
#app { display: flex; min-height: 100vh; }
.sidebar { width: var(--sidebar-width); background: var(--bg-secondary); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; transition: transform 0.3s ease; }
.sidebar-header { padding: var(--space-lg); border-bottom: 1px solid var(--border-color); }
.sidebar-logo { display: flex; align-items: center; gap: var(--space-md); }
.sidebar-logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--root-green), var(--leaf-green)); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 1.25rem; }
.sidebar-logo-text { font-family: var(--font-display); font-size: 1.5rem; font-weight: 600; }
.sidebar-nav { flex: 1; padding: var(--space-md); overflow-y: auto; }
.nav-section { margin-bottom: var(--space-lg); }
.nav-section-title { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-tertiary); padding: var(--space-sm) var(--space-md); }
.nav-item { display: flex; align-items: center; gap: var(--space-md); padding: var(--space-md); border-radius: var(--radius-md); color: var(--text-secondary); transition: all var(--transition); cursor: pointer; font-size: 0.95rem; }
.nav-item:hover { background: var(--hover-bg); color: var(--text-primary); }
.nav-item.active { background: linear-gradient(135deg, var(--root-green), var(--root-green-light)); color: white; }
.nav-item-icon { width: 20px; text-align: center; }
.sidebar-footer { padding: var(--space-md); border-top: 1px solid var(--border-color); }
.user-menu { display: flex; align-items: center; gap: var(--space-md); padding: var(--space-md); border-radius: var(--radius-md); cursor: pointer; }
.user-menu:hover { background: var(--hover-bg); }
.user-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--root-green), var(--leaf-green)); display: flex; align-items: center; justify-content: center; font-weight: 600; color: white; overflow: hidden; }
.user-avatar img { width: 100%; height: 100%; object-fit: cover; }
.user-info { flex: 1; min-width: 0; }
.user-name { font-weight: 500; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-email { font-size: 0.75rem; color: var(--text-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.main-content { flex: 1; margin-left: var(--sidebar-width); min-height: 100vh; display: flex; flex-direction: column; }
.main-header { height: var(--header-height); background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 var(--space-xl); position: sticky; top: 0; z-index: 50; }
.header-left { display: flex; align-items: center; gap: var(--space-lg); }
.menu-toggle { display: none; width: 40px; height: 40px; align-items: center; justify-content: center; border-radius: var(--radius-md); color: var(--text-secondary); font-size: 1.25rem; }
.page-title { font-family: var(--font-display); font-size: 1.25rem; }
.header-right { display: flex; align-items: center; gap: var(--space-md); }
.header-btn { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-md); color: var(--text-secondary); transition: all var(--transition); }
.header-btn:hover { background: var(--hover-bg); color: var(--text-primary); }
.main-body { flex: 1; padding: var(--space-xl); max-width: var(--max-content); width: 100%; margin: 0 auto; box-sizing: border-box; }

/* Components */
.card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: var(--space-lg); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-sm); padding: var(--space-md) var(--space-lg); border-radius: var(--radius-md); font-weight: 500; font-size: 0.95rem; transition: all var(--transition); }
.btn-primary { background: linear-gradient(135deg, var(--root-green), var(--root-green-light)); color: white; }
.btn-primary:hover { box-shadow: 0 4px 20px rgba(45, 90, 71, 0.4); transform: translateY(-1px); }
.btn-secondary { background: var(--hover-bg); color: var(--text-primary); border: 1px solid var(--border-color); }
.btn-secondary:hover { border-color: var(--root-green); }
.btn-ghost { color: var(--text-secondary); }
.btn-ghost:hover { background: var(--hover-bg); color: var(--text-primary); }
.btn-google { background: white; color: #333; border: 1px solid #ddd; }
.btn-google:hover { background: #f5f5f5; box-shadow: var(--shadow-md); }
.btn-sm { padding: var(--space-sm) var(--space-md); font-size: 0.85rem; }
.btn-lg { padding: var(--space-lg) var(--space-xl); font-size: 1.05rem; }
.btn-block { width: 100%; }
.btn:disabled { opacity: 0.6; cursor: not-allowed; }

.input-group { margin-bottom: var(--space-lg); }
.input-label { display: block; font-size: 0.85rem; font-weight: 500; color: var(--text-secondary); margin-bottom: var(--space-sm); }
.input-field { width: 100%; padding: var(--space-md); background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--radius-md); color: var(--text-primary); font-size: 1rem; transition: all var(--transition); }
.input-field:focus { outline: none; border-color: var(--root-green); box-shadow: 0 0 0 3px rgba(45, 90, 71, 0.15); }
.input-field::placeholder { color: var(--text-tertiary); }
.input-error { border-color: var(--error); }
.error-text { color: var(--error); font-size: 0.85rem; margin-top: var(--space-xs); }

/* Auth Screens */
.auth-container { min-height: 100vh; display: flex; }
.auth-left { flex: 1; background: linear-gradient(135deg, var(--root-green), var(--root-green-dark)); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: var(--space-3xl); color: white; position: relative; overflow: hidden; }
.auth-left::before { content: ''; position: absolute; top: -50%; right: -50%; width: 100%; height: 100%; background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%); }
.auth-brand { text-align: center; position: relative; z-index: 1; }
.auth-logo { font-size: 5rem; margin-bottom: var(--space-lg); }
.auth-brand-name { font-family: var(--font-display); font-size: 3.5rem; font-weight: 600; margin-bottom: var(--space-md); }
.auth-tagline { font-size: 1.25rem; opacity: 0.9; }
.auth-right { flex: 1; display: flex; align-items: center; justify-content: center; padding: var(--space-2xl); background: var(--bg-primary); }
.auth-form-container { width: 100%; max-width: 420px; }
.auth-form-title { font-size: 2rem; margin-bottom: var(--space-sm); text-align: center; }
.auth-form-subtitle { color: var(--text-secondary); text-align: center; margin-bottom: var(--space-xl); }
.auth-divider { display: flex; align-items: center; gap: var(--space-md); margin: var(--space-xl) 0; color: var(--text-tertiary); font-size: 0.85rem; }
.auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: var(--border-color); }
.auth-footer { text-align: center; margin-top: var(--space-xl); color: var(--text-secondary); font-size: 0.9rem; }
.auth-footer a { color: var(--root-green); font-weight: 500; }
.auth-footer a:hover { text-decoration: underline; }

/* Tool Cards */
.tool-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-xl); padding: var(--space-xl); cursor: pointer; transition: all var(--transition); position: relative; overflow: hidden; }
.tool-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--root-green), var(--leaf-green)); opacity: 0; transition: opacity var(--transition); }
.tool-card:hover { border-color: var(--root-green); box-shadow: var(--shadow-lg); transform: translateY(-4px); }
.tool-card:hover::before { opacity: 1; }
.tool-card.coming-soon { opacity: 0.6; cursor: not-allowed; }
.tool-card.coming-soon:hover { transform: none; box-shadow: none; border-color: var(--border-color); }
.tool-icon { width: 56px; height: 56px; border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; font-size: 1.75rem; margin-bottom: var(--space-lg); }
.tool-title { font-family: var(--font-display); font-size: 1.15rem; margin-bottom: var(--space-sm); }
.tool-description { font-size: 0.9rem; color: var(--text-secondary); line-height: 1.5; margin-bottom: var(--space-lg); }
.tool-meta { display: flex; align-items: center; gap: var(--space-sm); flex-wrap: wrap; }
.tool-tag { padding: var(--space-xs) var(--space-sm); background: var(--hover-bg); border-radius: var(--radius-sm); font-size: 0.75rem; color: var(--text-secondary); }

/* Grids */
.grid { display: grid; gap: var(--space-lg); }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }

/* Stats */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: var(--space-lg); }
.stat-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: var(--space-lg); }
.stat-label { font-size: 0.8rem; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: var(--space-sm); }
.stat-value { font-family: var(--font-display); font-size: 2rem; font-weight: 600; }

/* Welcome Banner */
.welcome-banner { background: linear-gradient(135deg, var(--root-green), var(--root-green-dark)); border-radius: var(--radius-xl); padding: var(--space-2xl); color: white; margin-bottom: var(--space-xl); position: relative; overflow: hidden; }
.welcome-banner::after { content: '🌱'; position: absolute; right: var(--space-2xl); bottom: -20px; font-size: 8rem; opacity: 0.15; }
.welcome-title { font-size: 1.75rem; margin-bottom: var(--space-sm); }
.welcome-subtitle { opacity: 0.9; max-width: 500px; }

/* Section Headers */
.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-lg); }
.section-title { font-family: var(--font-display); font-size: 1.25rem; }

/* Empty State */
.empty-state { text-align: center; padding: var(--space-3xl); }
.empty-state-icon { font-size: 4rem; margin-bottom: var(--space-lg); }
.empty-state-title { font-size: 1.5rem; margin-bottom: var(--space-md); }
.empty-state-description { color: var(--text-secondary); max-width: 400px; margin: 0 auto; }

/* Toast */
.toast-container { position: fixed; bottom: var(--space-lg); right: var(--space-lg); z-index: 2000; }
.toast { background: var(--slate-800); color: white; padding: var(--space-md) var(--space-lg); border-radius: var(--radius-md); box-shadow: var(--shadow-lg); margin-top: var(--space-sm); animation: fadeUp 0.3s ease; display: flex; align-items: center; gap: var(--space-sm); }
.toast.success { border-left: 4px solid var(--success); }
.toast.error { border-left: 4px solid var(--error); }
.toast.info { border-left: 4px solid var(--info); }

/* Loading */
.loading-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: var(--space-lg); }
.loading-spinner { width: 48px; height: 48px; border: 3px solid var(--border-color); border-top-color: var(--root-green); border-radius: 50%; animation: spin 1s linear infinite; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: var(--space-lg); }
.modal { background: var(--bg-secondary); border-radius: var(--radius-xl); max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; animation: fadeUp 0.3s ease; }
.modal-header { padding: var(--space-lg); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; }
.modal-title { font-family: var(--font-display); font-size: 1.25rem; }
.modal-close { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-sm); color: var(--text-tertiary); }
.modal-close:hover { background: var(--hover-bg); }
.modal-body { padding: var(--space-lg); }
.modal-footer { padding: var(--space-lg); border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; gap: var(--space-md); }

/* Coming Soon Badge */
.coming-soon-badge { display: inline-flex; align-items: center; gap: var(--space-sm); padding: var(--space-sm) var(--space-md); background: linear-gradient(135deg, var(--warning), #fbbf24); color: #333; border-radius: var(--radius-md); font-size: 0.8rem; font-weight: 600; }

/* Sidebar Overlay (mobile) */
.sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 99; display: none; }
.sidebar-overlay.show { display: block; }

/* Responsive */
@media (max-width: 1024px) {
    .grid-3, .grid-4 { grid-template-columns: repeat(2, 1fr); }
    .auth-left { display: none; }
}
@media (max-width: 768px) {
    .sidebar { transform: translateX(-100%); width: 85%; max-width: 320px; }
    .sidebar.open { transform: translateX(0); }
    .main-content { margin-left: 0; overflow-x: hidden; }
    .menu-toggle { display: flex; }
    .main-body { padding: var(--space-md); overflow-x: hidden; max-width: 100vw; box-sizing: border-box; }
    .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
    .welcome-banner { padding: var(--space-lg); }
    .welcome-banner::after { display: none; }
}
@media (max-width: 480px) {
    .main-body { padding: var(--space-sm); }
}

/* ========== NETFLIX-STYLE VIDEOS PAGE ========== */
/* Videos Page - Full Width, Edge to Edge */
.videos-page {
    min-height: 100vh;
    background: #141414;
    color: white;
    overflow-x: hidden;
    box-sizing: border-box;
    padding: 0;
    margin: 0;
    width: 100%;
    position: relative;
}

/* When videos page is shown - override backgrounds */
.main-body.full-width {
    max-width: none;
    padding: 0;
    margin: 0;
    width: 100%;
    background: #141414;
}

/* Body class for videos mode - ensures no purple shows anywhere */
body.videos-mode {
    background: #141414;
}
body.videos-mode .main-content {
    background: #141414;
}
body.videos-mode .main-header {
    background: #141414;
    border-bottom-color: #333;
}

/* Empty and Loading States */
.videos-empty, .videos-loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
    padding: 40px 20px;
    text-align: center;
}
.videos-empty-icon {
    font-size: 4rem;
    margin-bottom: 24px;
}
.videos-empty h3 {
    margin: 0 0 12px;
    font-size: 1.5rem;
}
.videos-empty p {
    color: #999;
    margin: 0 0 24px;
}
.videos-loading .loading-spinner {
    border-color: #333;
    border-top-color: #e50914;
    margin-bottom: 16px;
}
.videos-loading p {
    color: #999;
}

/* Hero Section - Full Width */
.videos-hero {
    position: relative;
    width: 100%;
    height: 60vh;
    min-height: 350px;
    max-height: 500px;
    overflow: hidden;
}
.videos-hero-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
}
.videos-hero-gradient-side {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 40%, rgba(0,0,0,0.2) 70%, rgba(0,0,0,0.1) 100%);
}
.videos-hero-gradient-bottom {
    position: absolute;
    inset: 0;
    background: linear-gradient(0deg, #0a0a0a 0%, rgba(10,10,10,0.8) 15%, transparent 40%);
}
.videos-hero-content {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 40px 60px;
    max-width: 600px;
}
.videos-hero-church {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 20px;
}
.videos-hero-logo {
    width: 48px;
    height: 48px;
    border-radius: 10px;
    object-fit: contain;
    background: rgba(0,0,0,0.6);
    padding: 8px;
    box-sizing: border-box;
}
.videos-hero-logo-placeholder {
    width: 48px;
    height: 48px;
    background: #e50914;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
}
.videos-hero-church-name {
    font-size: 1.1rem;
    font-weight: 500;
    color: #ccc;
}
.videos-hero-title {
    font-size: 2.2rem;
    font-weight: 700;
    margin: 0 0 12px;
    text-shadow: 2px 2px 10px rgba(0,0,0,0.9);
    line-height: 1.2;
}
.videos-hero-meta {
    font-size: 1rem;
    color: #bbb;
    margin: 0 0 28px;
}
.videos-hero-buttons {
    display: flex;
    gap: 14px;
}
.videos-play-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 32px;
    background: white;
    color: #000;
    border: none;
    border-radius: 4px;
    font-size: 1.15rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, background 0.15s;
}
.videos-play-btn:hover {
    transform: scale(1.05);
    background: #e5e5e5;
}
.videos-back-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 28px;
    background: rgba(109,109,110,0.7);
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 1.05rem;
    cursor: pointer;

<script>
// ========== FIREBASE CONFIGURATION ==========
// IMPORTANT: Replace with your own Firebase config from console.firebase.google.com
const firebaseConfig = {
    apiKey: "AIzaSyBUE9zqL5d0xzDhNeo5QMeonMMf6eH5BVs",
    authDomain: "rooted22.firebaseapp.com",
    projectId: "rooted22",
    storageBucket: "rooted22.firebasestorage.app",
    messagingSenderId: "724697634094",
    appId: "1:724697634094:web:2ada0c20a5855d230d56bf"
};

// Initialize Firebase
let firebaseInitialized = false;
let auth = null;
let db = null;
let storage = null;

function initFirebase() {
    try {
        if (firebaseConfig.apiKey === "YOUR_API_KEY") {
            console.warn("Firebase not configured - running in local mode");
            return false;
        }
        firebase.initializeApp(firebaseConfig);
        auth = firebase.auth();
        db = firebase.firestore();
        storage = firebase.storage();
        firebaseInitialized = true;
        console.log("Firebase initialized successfully");
        return true;
    } catch (e) {
        console.error("Firebase init error:", e);
        return false;
    }
}

// ========== AUTH SERVICE ==========
const Auth = {
    currentUser: null,
    
    async init() {
        if (!firebaseInitialized) {
            // Local mode - check localStorage
            const localUser = localStorage.getItem('rooted_user');
            if (localUser) {
                this.currentUser = JSON.parse(localUser);
                return this.currentUser;
            }
            return null;
        }
        
        return new Promise((resolve) => {
            auth.onAuthStateChanged(async (user) => {
                if (user) {
                    this.currentUser = {
                        uid: user.uid,
                        email: user.email,
                        name: user.displayName || user.email?.split('@')[0] || 'User',
                        photoURL: user.photoURL,
                        provider: user.providerData[0]?.providerId || 'email'
                    };
                    // Ensure user document exists
                    await UserDB.ensureUserDoc(this.currentUser);
                    localStorage.setItem('rooted_user', JSON.stringify(this.currentUser));
                } else {
                    this.currentUser = null;
                    localStorage.removeItem('rooted_user');
                }
                resolve(this.currentUser);
            });
        });
    },
    
    async signUpWithEmail(email, password, name) {
        if (!firebaseInitialized) {
            // Local mode
            const user = { uid: 'local_' + Date.now(), email, name, photoURL: null, provider: 'local' };
            this.currentUser = user;
            localStorage.setItem('rooted_user', JSON.stringify(user));
            await UserDB.ensureUserDoc(user);
            return user;
        }
        
        const result = await auth.createUserWithEmailAndPassword(email, password);
        await result.user.updateProfile({ displayName: name });
        this.currentUser = {
            uid: result.user.uid,
            email: result.user.email,
            name: name,
            photoURL: null,
            provider: 'email'
        };
        await UserDB.ensureUserDoc(this.currentUser);
        localStorage.setItem('rooted_user', JSON.stringify(this.currentUser));
        return this.currentUser;
    },
    
    async signInWithEmail(email, password) {
        if (!firebaseInitialized) {
            // Local mode - check local storage for existing user
            const users = JSON.parse(localStorage.getItem('rooted_users') || '{}');
            if (users[email] && users[email].password === password) {
                this.currentUser = users[email].user;
                localStorage.setItem('rooted_user', JSON.stringify(this.currentUser));
                return this.currentUser;
            }
            throw new Error('Invalid email or password');
        }
        
        const result = await auth.signInWithEmailAndPassword(email, password);
        this.currentUser = {
            uid: result.user.uid,
            email: result.user.email,
            name: result.user.displayName || result.user.email?.split('@')[0],
            photoURL: result.user.photoURL,
            provider: 'email'
        };
        localStorage.setItem('rooted_user', JSON.stringify(this.currentUser));
        return this.currentUser;
    },
    
    async signInWithGoogle() {
        if (!firebaseInitialized) {
            toast('Google Sign-In requires Firebase configuration', 'error');
            throw new Error('Firebase not configured');
        }
        
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        const result = await auth.signInWithPopup(provider);
        this.currentUser = {
            uid: result.user.uid,
            email: result.user.email,
            name: result.user.displayName,
            photoURL: result.user.photoURL,
            provider: 'google.com'
        };
        await UserDB.ensureUserDoc(this.currentUser);
        localStorage.setItem('rooted_user', JSON.stringify(this.currentUser));
        return this.currentUser;
    },
    
    async signOut() {
        if (firebaseInitialized) {
            await auth.signOut();
        }
        this.currentUser = null;
        localStorage.removeItem('rooted_user');
        localStorage.removeItem('rooted_nav');
    },
    
    async resetPassword(email) {
        if (!firebaseInitialized) {
            toast('Password reset requires Firebase configuration', 'error');
            throw new Error('Firebase not configured');
        }
        await auth.sendPasswordResetEmail(email);
    },
    
    async updateProfile(updates) {
        if (firebaseInitialized && auth.currentUser) {
            await auth.currentUser.updateProfile(updates);
        }
        Object.assign(this.currentUser, updates);
        localStorage.setItem('rooted_user', JSON.stringify(this.currentUser));
        await UserDB.updateUser(this.currentUser.uid, updates);
    }
};

// ========== USER DATABASE ==========
const UserDB = {
    async ensureUserDoc(user) {
        if (!firebaseInitialized) {
            // Local storage mode
            const users = JSON.parse(localStorage.getItem('rooted_users') || '{}');
            if (!users[user.email]) {
                users[user.email] = {
                    user: user,
                    profile: { name: user.name, email: user.email, createdAt: new Date().toISOString() },
                    toolProgress: {},
                    quizResults: {},
                    settings: {}
                };
                localStorage.setItem('rooted_users', JSON.stringify(users));
            }
            return;
        }
        
        const docRef = db.collection('users').doc(user.uid);
        const doc = await docRef.get();
        if (!doc.exists) {
            await docRef.set({
                profile: {
                    name: user.name,
                    email: user.email,
                    photoURL: user.photoURL,
                    provider: user.provider,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                },
                toolProgress: {},
                quizResults: {},
                settings: {}
            });
        }
    },
    
    async getUserData(uid) {
        if (!firebaseInitialized) {
            const users = JSON.parse(localStorage.getItem('rooted_users') || '{}');
            const user = Object.values(users).find(u => u.user.uid === uid);
            return user || null;
        }
        
        const doc = await db.collection('users').doc(uid).get();
        return doc.exists ? doc.data() : null;
    },
    
    async updateUser(uid, updates) {
        if (!firebaseInitialized) {
            const users = JSON.parse(localStorage.getItem('rooted_users') || '{}');
            const userKey = Object.keys(users).find(k => users[k].user.uid === uid);
            if (userKey) {
                users[userKey] = { ...users[userKey], ...updates };
                localStorage.setItem('rooted_users', JSON.stringify(users));
            }
            return;
        }
        
        await db.collection('users').doc(uid).update(updates);
    },
    
    async saveToolProgress(uid, toolId, progress) {
        const key = `toolProgress.${toolId}`;
        if (!firebaseInitialized) {
            const users = JSON.parse(localStorage.getItem('rooted_users') || '{}');
            const userKey = Object.keys(users).find(k => users[k].user.uid === uid);
            if (userKey) {

                localStorage.setItem('rooted_users', JSON.stringify(users));
            }
            return;

        await db.collection('users').doc(uid).update({
            [key]: { ...result, completedAt: firebase.firestore.FieldValue.serverTimestamp() }
        });
    },
    
    async saveSettings(uid, settings) {
        if (!firebaseInitialized) {
            const users = JSON.parse(localStorage.getItem('rooted_users') || '{}');
            const userKey = Object.keys(users).find(k => users[k].user.uid === uid);
            if (userKey) {
                users[userKey].settings = { ...users[userKey].settings, ...settings };
                localStorage.setItem('rooted_users', JSON.stringify(users));
            }
            return;

const State = {
    current: { screen: 'loading', user: null, activeNav: 'dashboard', sidebarOpen: false, accountType: 'user', userChurch: null, signupStep: 1, churchSearchResults: [] },
    listeners: [],
    set(updates) { 
        this.current = { ...this.current, ...updates }; 
        this.persistNavState();
        this.notify(); 
    },
    subscribe(fn) { this.listeners.push(fn); },
    notify() { this.listeners.forEach(fn => fn(this.current)); },
    
    // Persist navigation state to localStorage and URL
    persistNavState() {
        const { screen, activeNav, accountType } = this.current;
        if (screen === 'app' && activeNav) {
            localStorage.setItem('rooted_nav_state', JSON.stringify({
                screen,
                activeNav,
                accountType,
                timestamp: Date.now()
            }));
            // Update URL hash for back button support
            if (window.history && window.history.replaceState) {
                const hash = `#${activeNav}`;
                if (window.location.hash !== hash) {
                    window.history.pushState({ nav: activeNav }, '', hash);
                }
            }
        }
    },
    
    // Restore navigation state from localStorage or URL
    restoreNavState() {
        // First check URL hash
        const hash = window.location.hash.slice(1);
        if (hash && ['dashboard', 'my-church', 'church-videos', 'tools', 'progress', 'profile', 'settings', 
                     'church-dashboard', 'church-members', 'church-resources', 'church-checkin-resources',
                     'church-announcements', 'church-youtube', 'church-social', 'church-branding',
                     'church-membership', 'church-location', 'church-tools'].includes(hash)) {
            return { activeNav: hash };
        }
        
        // Fall back to localStorage
        try {
            const saved = localStorage.getItem('rooted_nav_state');
            if (saved) {
                const state = JSON.parse(saved);
                // Only restore if less than 24 hours old
                if (Date.now() - state.timestamp < 24 * 60 * 60 * 1000) {
                    return { activeNav: state.activeNav, accountType: state.accountType };
                }
            }
        } catch (e) {}
        return null;
    }
};

// Handle browser back/forward buttons
window.addEventListener('popstate', (event) => {
    if (event.state && event.state.nav) {
        State.set({ activeNav: event.state.nav });
        render();
    } else {
        // Check URL hash
        const hash = window.location.hash.slice(1);
        if (hash) {
            State.set({ activeNav: hash });
            render();
        }
    }
});

// Local cache for church data
let churchCache = {};

// ========== CHURCH DATABASE SERVICE ==========
const ChurchDB = {
    // Get church data from Firestore (with caching)
    async getChurch(churchId, forceRefresh = false) {
        if (!churchId) return null;
        
        // Check cache first (unless force refresh)
        if (!forceRefresh && churchCache[churchId]) {
            return churchCache[churchId];
        }
        
        if (!firebaseInitialized) {
            // Local mode - use localStorage
            const stored = JSON.parse(localStorage.getItem('rooted_church_data') || '{}');
            const data = { ...DEFAULT_CHURCHES[churchId], ...stored[churchId] };
            churchCache[churchId] = data;
            return data;
        }
        
        try {
            const doc = await db.collection('churches').doc(churchId).get();
            if (doc.exists) {
                const data = doc.data();
                churchCache[churchId] = data;
                return data;
            } else if (DEFAULT_CHURCHES[churchId]) {
                // Seed default church to Firestore
                await this.createChurch(churchId, DEFAULT_CHURCHES[churchId]);
                return DEFAULT_CHURCHES[churchId];
            }
            return null;
        } catch (e) {
            console.error('Error getting church:', e);
            return DEFAULT_CHURCHES[churchId] || null;
        }
    },
    
    // Get church data fresh from Firebase (bypasses cache)
    async getChurchFresh(churchId) {
        return this.getChurch(churchId, true);
    },
    
    // Create new church in Firestore
    async createChurch(churchId, churchData) {
        const data = {
            id: churchId,
            ...churchData,
            createdAt: firebaseInitialized ? firebase.firestore.FieldValue.serverTimestamp() : new Date().toISOString()
        };
        
        if (!firebaseInitialized) {
            const stored = JSON.parse(localStorage.getItem('rooted_church_data') || '{}');
            stored[churchId] = data;
            localStorage.setItem('rooted_church_data', JSON.stringify(stored));
            churchCache[churchId] = data;
            return churchId;
        }
        
        try {
            await db.collection('churches').doc(churchId).set(data);
            churchCache[churchId] = data;
            return churchId;
        } catch (e) {
            console.error('Error creating church:', e);
            throw e;
        }
    },
    
    // Update church data in Firestore
    async updateChurch(churchId, updates) {
        if (!firebaseInitialized) {
            const stored = JSON.parse(localStorage.getItem('rooted_church_data') || '{}');
            stored[churchId] = { ...(stored[churchId] || {}), ...updates, updatedAt: new Date().toISOString() };
            localStorage.setItem('rooted_church_data', JSON.stringify(stored));
            churchCache[churchId] = { ...churchCache[churchId], ...updates };
            return;
        }
        
        try {
            await db.collection('churches').doc(churchId).update({
                ...updates,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            churchCache[churchId] = { ...churchCache[churchId], ...updates };
        } catch (e) {
            console.error('Error updating church:', e);
            throw e;
        }
    },
    
    // Upload file to Firebase Storage
    async uploadFile(churchId, file, folder = 'resources') {
        if (!firebaseInitialized) {
            // Local mode - return blob URL (temporary)
            return {
                url: URL.createObjectURL(file),
                fileName: file.name,
                isLocal: true
            };
        }
        
        try {
            const fileName = `${Date.now()}_${file.name}`;
            const path = `churches/${churchId}/${folder}/${fileName}`;
            const ref = storage.ref(path);
            
            const snapshot = await ref.put(file);
            const url = await snapshot.ref.getDownloadURL();
            
            return {
                url,
                fileName: file.name,
                path,
                isLocal: false
            };
        } catch (e) {
            console.error('Error uploading file:', e);
            throw e;
        }
    },
    
    // Delete file from Firebase Storage
    async deleteFile(filePath) {
        if (!firebaseInitialized || !filePath) return;
        
        try {
            await storage.ref(filePath).delete();
        } catch (e) {
            console.error('Error deleting file:', e);
        }
    },
    
    // Add resource to church
    async addResource(churchId, resource, isCheckIn = false) {
        const church = await this.getChurch(churchId);
        const fieldName = isCheckIn ? 'checkInResources' : 'resources';
        const resources = church[fieldName] || [];
        
        resources.push({
            id: Date.now(),
            ...resource,
            date: new Date().toISOString().split('T')[0]
        });
        
        await this.updateChurch(churchId, { [fieldName]: resources });
        return resources;
    },
    
    // Delete resource from church
    async deleteResource(churchId, resourceId, isCheckIn = false) {
        const church = await this.getChurch(churchId);
        const fieldName = isCheckIn ? 'checkInResources' : 'resources';
        const resources = (church[fieldName] || []).filter(r => r.id !== resourceId);
        
        await this.updateChurch(churchId, { [fieldName]: resources });
        return resources;
    },
    
    // Add announcement
    async addAnnouncement(churchId, announcement) {
        const church = await this.getChurch(churchId);
        const announcements = church.announcements || [];
        
        announcements.unshift({
            id: Date.now(),
            ...announcement,
            date: new Date().toISOString().split('T')[0]
        });
        
        await this.updateChurch(churchId, { announcements });
        return announcements;
    },
    
    // Delete announcement
    async deleteAnnouncement(churchId, announcementId) {
        const church = await this.getChurch(churchId);
        const announcements = (church.announcements || []).filter(a => a.id !== announcementId);
        
        await this.updateChurch(churchId, { announcements });
        return announcements;
    },
    
    // Search churches
    async searchChurches(query) {
        if (!firebaseInitialized) {
            const stored = JSON.parse(localStorage.getItem('rooted_church_data') || '{}');
            const all = { ...DEFAULT_CHURCHES, ...stored };
            const q = query.toLowerCase();
            return Object.entries(all).filter(([id, church]) =>
                church.name?.toLowerCase().includes(q) ||
                church.address?.toLowerCase().includes(q) ||
                church.phone?.includes(q) ||
                id.toLowerCase().includes(q)
            ).map(([id, church]) => ({ id, ...church }));
        }
        
        try {
            // Get all churches and filter client-side
            // In production would use Algolia or Firebase Extensions for full-text search
            const snapshot = await db.collection('churches').get();
            const q = query.toLowerCase();
            return snapshot.docs
                .map(doc => ({ id: doc.id, ...doc.data() }))
                .filter(church => {
                    // Only include onboarded churches
                    if (church.onboarded === false) return false;
                    
                    // Search in multiple fields
                    const searchFields = [
                        church.name,
                        church.address,
                        church.phone,
                        church.id,
                        church.website
                    ].filter(Boolean).map(f => f.toLowerCase());
                    
                    return searchFields.some(field => field.includes(q));
                });
        } catch (e) {
            console.error('Error searching churches:', e);
            return [];
        }
    },
    
    // Get all churches (for user selection)
    async getAllChurches() {
        if (!firebaseInitialized) {
            const stored = JSON.parse(localStorage.getItem('rooted_church_data') || '{}');
            const all = { ...DEFAULT_CHURCHES, ...stored };
            return Object.entries(all).map(([id, church]) => ({ id, ...church }));
        }
        
        try {
            const snapshot = await db.collection('churches').get();
            return snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        } catch (e) {
            console.error('Error getting all churches:', e);
            return [];
        }
    },
    
    // Clear cache (useful when switching accounts)
    clearCache() {
        churchCache = {};
    }
};

// ========== USER CHURCH SERVICE ==========
const UserChurchDB = {
    // Get user's connected churches
    async getUserChurches(userId) {
        if (!firebaseInitialized) {
            const data = JSON.parse(localStorage.getItem('rooted_user_churches') || '{}');
            return data[userId] || [];
        }
        
        try {
            const doc = await db.collection('users').doc(userId).get();
            if (doc.exists) {
                return doc.data().churches || [];
            }
            return [];
        } catch (e) {
            console.error('Error getting user churches:', e);
            return [];
        }
    },
    
    // Add church to user
    async addChurch(userId, churchId) {
        if (!firebaseInitialized) {
            const data = JSON.parse(localStorage.getItem('rooted_user_churches') || '{}');
            const churches = data[userId] || [];
            if (churches.includes(churchId) || churches.length >= 5) return false;
            churches.push(churchId);
            data[userId] = churches;
            localStorage.setItem('rooted_user_churches', JSON.stringify(data));
            return true;
        }
        
        try {
            // First check if church has room for more members
            const churchDoc = await db.collection('churches').doc(churchId).get();
            if (churchDoc.exists) {
                const churchData = churchDoc.data();
                const maxMembers = churchData.maxMembers || 5; // Default to free tier
                const currentMembers = churchData.memberCount || 0;
                
                // Check member limit (-1 means unlimited)
                if (maxMembers !== -1 && currentMembers >= maxMembers) {
                    return { error: 'limit', message: `This church has reached its member limit (${maxMembers}). Please contact the church admin.` };
                }
            }
            
            const userRef = db.collection('users').doc(userId);
            const doc = await userRef.get();
            const churches = doc.exists ? (doc.data().churches || []) : [];
            
            if (churches.includes(churchId)) return { error: 'exists', message: 'You are already a member of this church.' };
            if (churches.length >= 5) return { error: 'max', message: 'You can only join up to 5 churches.' };
            
            churches.push(churchId);
            await userRef.update({ churches });
            
            // Increment church member count
            await db.collection('churches').doc(churchId).update({
                memberCount: firebase.firestore.FieldValue.increment(1)
            });
            
            // Add user to church's members list
            await db.collection('churches').doc(churchId).collection('members').doc(userId).set({
                joinedAt: new Date().toISOString(),
                userId: userId
            });
            
            return true;
        } catch (e) {
            console.error('Error adding church:', e);
            return false;
        }
    },
    
    // Remove church from user
    async removeChurch(userId, churchId) {
        if (!firebaseInitialized) {
            const data = JSON.parse(localStorage.getItem('rooted_user_churches') || '{}');
            data[userId] = (data[userId] || []).filter(id => id !== churchId);
            localStorage.setItem('rooted_user_churches', JSON.stringify(data));
            return;
        }
        
        try {
            const userRef = db.collection('users').doc(userId);
            await userRef.update({
                churches: firebase.firestore.FieldValue.arrayRemove(churchId)
            });
            
            // Decrement church member count
            await db.collection('churches').doc(churchId).update({
                memberCount: firebase.firestore.FieldValue.increment(-1)
            });
            
            // Remove user from church's members list
            await db.collection('churches').doc(churchId).collection('members').doc(userId).delete();
        } catch (e) {
            console.error('Error removing church:', e);
        }
    },
    
    // Get/Set active church
    async getActiveChurch(userId) {
        if (!firebaseInitialized) {
            return localStorage.getItem('rooted_active_church_' + userId) || null;
        }
        
        try {
            const doc = await db.collection('users').doc(userId).get();
            return doc.exists ? doc.data().activeChurch : null;
        } catch (e) {
            return null;
        }
    },
    
    async setActiveChurch(userId, churchId) {
        if (!firebaseInitialized) {
            localStorage.setItem('rooted_active_church_' + userId, churchId);
            return;
        }
        
        try {
            await db.collection('users').doc(userId).update({ activeChurch: churchId });
        } catch (e) {
            console.error('Error setting active church:', e);
        }
    },
    
    // Check-in functions
    async checkIn(userId, churchId, churchName) {
        const today = new Date().toISOString().split('T')[0];
        const checkIn = {
            churchId,
            churchName,
            date: today,
            time: new Date().toISOString()
        };
        
        if (!firebaseInitialized) {
            const checkIns = JSON.parse(localStorage.getItem('rooted_checkins') || '{}');
            if (!checkIns[userId]) checkIns[userId] = {};
            checkIns[userId][churchId] = today;
            localStorage.setItem('rooted_checkins', JSON.stringify(checkIns));
            
            const history = JSON.parse(localStorage.getItem('rooted_checkin_history') || '{}');
            if (!history[userId]) history[userId] = [];
            history[userId].push(checkIn);
            localStorage.setItem('rooted_checkin_history', JSON.stringify(history));
            return;
        }
        
        try {
            const userRef = db.collection('users').doc(userId);
            await userRef.update({
                [`checkIns.${churchId}`]: today,
                checkInHistory: firebase.firestore.FieldValue.arrayUnion(checkIn)
            });
        } catch (e) {
            console.error('Error checking in:', e);
        }
    },
    
    async isCheckedInToday(userId, churchId) {
        const today = new Date().toISOString().split('T')[0];
        
        if (!firebaseInitialized) {
            const checkIns = JSON.parse(localStorage.getItem('rooted_checkins') || '{}');
            return checkIns[userId]?.[churchId] === today;
        }
        
        try {
            const doc = await db.collection('users').doc(userId).get();
            return doc.exists && doc.data().checkIns?.[churchId] === today;
        } catch (e) {
            return false;
        }
    }
};

// ========== GEOFENCING SYSTEM ==========
const GEOFENCE_RADIUS_FEET = 250;
const FEET_PER_METER = 3.28084;

let userLocation = null;
let locationWatchId = null;
let nearbyChurches = [];
let checkedInTodayCache = {};

function startLocationTracking() {
    if (!navigator.geolocation) {
        console.log('Geolocation not supported');
        return;
    }
    
    navigator.geolocation.getCurrentPosition(
        (position) => {
            userLocation = {
                latitude: position.coords.latitude,
                longitude: position.coords.longitude,
                accuracy: position.coords.accuracy
            };
            checkNearbyChurches();
        },
        (error) => {
            console.log('Location error:', error.message);
        },
        { enableHighAccuracy: true }
    );
    
    locationWatchId = navigator.geolocation.watchPosition(
        (position) => {
            userLocation = {
                latitude: position.coords.latitude,
                longitude: position.coords.longitude,
                accuracy: position.coords.accuracy
            };
            checkNearbyChurches();
        },
        (error) => {
            console.log('Location watch error:', error.message);
        },
        { enableHighAccuracy: true, maximumAge: 30000, timeout: 27000 }
    );
}

function stopLocationTracking() {
    if (locationWatchId) {
        navigator.geolocation.clearWatch(locationWatchId);
        locationWatchId = null;
    }
}

function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371e3;
    const φ1 = lat1 * Math.PI / 180;
    const φ2 = lat2 * Math.PI / 180;
    const Δφ = (lat2 - lat1) * Math.PI / 180;
    const Δλ = (lon2 - lon1) * Math.PI / 180;
    
    const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
              Math.cos(φ1) * Math.cos(φ2) *
              Math.sin(Δλ/2) * Math.sin(Δλ/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    
    return R * c;
}

function isWithinGeofence(churchId) {
    if (!userLocation) return false;
    
    const church = getChurchData(churchId);
    if (!church || !church.latitude || !church.longitude) return false;
    
    const distanceMeters = calculateDistance(
        userLocation.latitude, userLocation.longitude,
        church.latitude, church.longitude
    );
    
    return distanceMeters * FEET_PER_METER <= GEOFENCE_RADIUS_FEET;
}

function getDistanceToChurch(churchId) {
    if (!userLocation) return null;
    
    const church = getChurchData(churchId);
    if (!church || !church.latitude || !church.longitude) return null;
    
    const distanceMeters = calculateDistance(
        userLocation.latitude, userLocation.longitude,
        church.latitude, church.longitude
    );
    
    return Math.round(distanceMeters * FEET_PER_METER);
}

async function checkNearbyChurches() {
    if (!userLocation || !Auth.currentUser) return;
    
    const userChurches = getUserChurches(Auth.currentUser.uid);
    const previousNearby = [...nearbyChurches];
    nearbyChurches = [];
    
    for (const churchId of userChurches) {
        const church = await getChurchDataAsync(churchId);
        if (church?.latitude && church?.longitude && isWithinGeofence(churchId)) {
            nearbyChurches.push(churchId);
            
            if (!previousNearby.includes(churchId)) {
                const isChecked = await isCheckedInToday(churchId);
                if (!isChecked) {
                    showCheckInPopup(churchId);
                }
            }
        }
    }
}

// Navigation history for back button
let navigationHistory = [];

function navigate(nav) {
    // Don't add to history if navigating to same page
    if (State.current.activeNav && State.current.activeNav !== nav) {
        navigationHistory.push(State.current.activeNav);
        // Keep history limited
        if (navigationHistory.length > 20) navigationHistory.shift();
    }
    
    State.set({ activeNav: nav });
    toggleSidebar(false);
    
    // Toggle videos-mode class on body for full-width styling
    document.body.classList.toggle('videos-mode', nav === 'church-videos');
    
    // Save nav for page refresh (especially for church admin)
    if (State.current.accountType === 'church') {
        localStorage.setItem('rooted_nav', nav);
    }
}

function goBack() {
    if (navigationHistory.length > 0) {
        const prev = navigationHistory.pop();
        State.set({ activeNav: prev });
    } else {
        // Default fallback based on account type
        if (State.current.accountType === 'church') {
            State.set({ activeNav: 'church-dashboard' });
        } else {
            State.set({ activeNav: 'dashboard' });
        }
    }
}

    document.getElementById('modalContainer').innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()">${content}</div>`;

async function handleSuperAdminLogin(e) {
    e.preventDefault();
    const username = document.getElementById('superAdminUsername').value;
    const password = document.getElementById('superAdminPassword').value;
    
    // Check local super admin
    if (username === SUPER_ADMIN.username && password === SUPER_ADMIN.password) {
        closeModal();
        await loadRegistrationCodes();
        State.set({ screen: 'super-admin', accountType: 'super-admin' });
        toast('Welcome, Super Admin! 👑', 'success');
        return;
    }
    
    // Check Firestore for additional super admins
    if (firebaseInitialized) {
        try {
            const adminDoc = await db.collection('super_admins').doc(username).get();
            if (adminDoc.exists && adminDoc.data().password === password) {
                closeModal();
                await loadRegistrationCodes();
                State.set({ screen: 'super-admin', accountType: 'super-admin' });
                toast('Welcome, Super Admin! 👑', 'success');
                return;
            }
        } catch (e) {
            console.log('Super admin check failed:', e);
        }
    }
    
    toast('Invalid super admin credentials', 'error');
}

async function createRegistrationCode(e) {
    e.preventDefault();
    const code = document.getElementById('newCodeValue').value.toUpperCase();
    const tier = document.getElementById('newCodeTier').value;
    const description = document.getElementById('newCodeDescription').value;
    
    const tierInfo = {
        'free': { maxMembers: 5, description: description || 'Free - Up to 5 members', price: 0 },
        'starter': { maxMembers: 50, description: description || 'Starter - Up to 50 members', price: 19 },
        'small': { maxMembers: 200, description: description || 'Small - Up to 200 members', price: 49 },
        'medium': { maxMembers: 500, description: description || 'Medium - Up to 500 members', price: 99 },
        'large': { maxMembers: 2000, description: description || 'Large - Up to 2,000 members', price: 199 },
        'unlimited': { maxMembers: -1, description: description || 'Unlimited members', price: 399 }
    };
    
    const codeData = {
        tier,
        ...tierInfo[tier],
        active: true,
        createdAt: new Date().toISOString()
    };
    
    // Save locally
    registrationCodes[code] = codeData;
    
    // Save to Firestore
    if (firebaseInitialized) {
        try {
            await db.collection('registration_codes').doc(code).set(codeData);
        } catch (e) {
            console.log('Could not save code to Firestore:', e);
        }
    }
    
    closeModal();
    toast('Registration code created: ' + code, 'success');
    renderSuperAdminPage('codes');
}

async function deleteCode(code) {
    if (!confirm('Are you sure you want to delete this code?')) return;
    
    delete registrationCodes[code];
    
    if (firebaseInitialized) {
        try {
            await db.collection('registration_codes').doc(code).delete();
        } catch (e) {
            console.log('Could not delete code from Firestore:', e);
        }
    }
    
    toast('Code deleted', 'success');
    renderSuperAdminPage('codes');
}

async function deleteChurch(churchId) {
    if (!confirm('Are you sure you want to delete this church? This cannot be undone.')) return;
    
    if (firebaseInitialized) {
        try {
            await db.collection('churches').doc(churchId).delete();
            await db.collection('church_admins').doc(churchId).delete();
            toast('Church deleted', 'success');
            renderSuperAdminPage('churches');
        } catch (e) {
            toast('Error deleting church: ' + e.message, 'error');
        }
    }
}

async function handleChurchRegistration(e) {
    e.preventDefault();
    
    const code = document.getElementById('regCode').value.toUpperCase();
    const churchName = document.getElementById('regChurchName').value;
    const username = document.getElementById('regUsername').value.toLowerCase().replace(/[^a-z0-9]/g, '');
    const password = document.getElementById('regPassword').value;
    const passwordConfirm = document.getElementById('regPasswordConfirm').value;
    
    const btn = document.getElementById('regSubmitBtn');
    btn.disabled = true;
    btn.textContent = 'Registering...';
    
    // Validate passwords match
    if (password !== passwordConfirm) {
        toast('Passwords do not match', 'error');
        btn.disabled = false;
        btn.textContent = 'Register Church';
        return;
    }
    
    // Load registration codes from Firestore
    await loadRegistrationCodes();
    
    // Validate code
    const codeData = registrationCodes[code];
    if (!codeData || !codeData.active) {
        toast('Invalid or expired registration code', 'error');
        btn.disabled = false;
        btn.textContent = 'Register Church';
        return;
    }
    
    // Check if username already exists
    if (firebaseInitialized) {
        try {
            const existingAdmin = await db.collection('church_admins').doc(username).get();
            if (existingAdmin.exists) {
                toast('This username is already taken', 'error');
                btn.disabled = false;
                btn.textContent = 'Register Church';
                return;
            }
        } catch (e) {
            console.log('Error checking username:', e);
        }
    }
    
    // Generate church ID from name
    const churchId = churchName.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
    
    // Create church in Firestore
    const churchData = {
        id: churchId,
        name: churchName,
        address: '',
        phone: '',
        website: '',
        tier: codeData.tier,
        maxMembers: codeData.maxMembers,
        memberCount: 0,
        announcements: [],
        resources: [],
        checkInResources: [],
        enabledTools: ['seasons', 'spiritual-formation', 'bible-reading', 'prayer-journal', 'scripture-memory'],
        onboarded: false,
        createdAt: new Date().toISOString(),
        registrationCode: code
    };
    
    const adminData = {
        username: username,
        password: password,
        churchId: churchId,
        churchName: churchName,
        onboarded: false,
        tier: codeData.tier,
        createdAt: new Date().toISOString()
    };
    
    if (firebaseInitialized) {
        try {
            // Save church
            await db.collection('churches').doc(churchId).set(churchData);
            
            // Save admin
            await db.collection('church_admins').doc(username).set(adminData);
            
            toast('Church registered successfully! 🎉', 'success');
            
            // Start onboarding with tier info
            churchOnboarding = {
                step: 1,
                adminUsername: username,
                churchId: churchId,
                tier: codeData.tier,
                maxMembers: codeData.maxMembers,
                data: {
                    name: churchName,
                    address: '',
                    phone: '',
                    website: '',
                    socialMedia: { facebook: '', instagram: '', youtube: '', twitter: '' }
                }
            };
            
            State.set({ screen: 'church-onboarding' });
            
        } catch (e) {
            toast('Error registering church: ' + e.message, 'error');
            btn.disabled = false;
            btn.textContent = 'Register Church';
        }
    } else {
        toast('Firebase not connected. Please try again.', 'error');
        btn.disabled = false;
        btn.textContent = 'Register Church';
    }
}

async function handleChurchAdminLogin(e) {
    e.preventDefault();
    const username = document.getElementById('churchUsername').value;
    const password = document.getElementById('churchPassword').value;
    
    let admin = null;
    
    // Try to get admin from Firestore first
    if (firebaseInitialized) {
        try {
            const adminDoc = await db.collection('church_admins').doc(username).get();
            if (adminDoc.exists) {
                const adminData = adminDoc.data();
                if (adminData.password === password) {
                    admin = adminData;
                }
            }
        } catch (e) {
            console.log('Firestore admin lookup failed, trying local:', e);
        }
    }
    
    // Fallback to hardcoded admins (for testing)
    if (!admin) {
        const localAdmin = CHURCH_ADMIN_ACCOUNTS[username];
        if (localAdmin && localAdmin.password === password) {
            admin = localAdmin;
        }
    }
    
    if (admin) {
        // Load church data from cloud
        const church = await ChurchDB.getChurch(admin.churchId);
        
        // Check if church needs onboarding
        if (!admin.onboarded || !church?.onboarded) {
            churchOnboarding = {
                step: 1,
                adminUsername: username,
                churchId: admin.churchId,
                data: {
                    name: admin.churchName || '',
                    address: '',
                    phone: '',
                    website: '',
                    socialMedia: { facebook: '', instagram: '', youtube: '', twitter: '' }
                }
            };
            State.set({ screen: 'church-onboarding' });
            return;
        }
        
        // Save church admin session to localStorage
        localStorage.setItem('rooted_church_admin_session', JSON.stringify({
            username: username,
            churchId: admin.churchId,
            churchName: church.name
        }));
        
        State.set({ 
            screen: 'app', 
            accountType: 'church',
            user: { name: church.name, email: 'admin@' + admin.churchId, churchId: admin.churchId },
            activeNav: 'church-dashboard'
        });
        toast('Welcome, ' + church.name + ' Admin! ⛪', 'success');
    } else {
        toast('Invalid admin credentials', 'error');
    }
}

// Helper function to normalize URLs
function normalizeUrl(url) {
    if (!url) return '';
    url = url.trim();
    if (url && !url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
    }
    return url;
}

function onboardingNext(e) {
    if (e) e.preventDefault();
    const step = churchOnboarding.step;
    
    // Save current step data
    if (step === 1) {
        churchOnboarding.data.name = document.getElementById('ob_name')?.value || '';
        churchOnboarding.data.address = document.getElementById('ob_address')?.value || '';
        churchOnboarding.data.phone = document.getElementById('ob_phone')?.value || '';
    } else if (step === 2) {
        // Normalize website URL
        const websiteInput = document.getElementById('ob_website')?.value || '';
        churchOnboarding.data.website = normalizeUrl(websiteInput);
        // Simulate website lookup for social media
        simulateWebsiteLookup();
    } else if (step === 3) {
        churchOnboarding.data.socialMedia = {
            facebook: normalizeUrl(document.getElementById('ob_facebook')?.value),
            instagram: normalizeUrl(document.getElementById('ob_instagram')?.value),
            youtube: normalizeUrl(document.getElementById('ob_youtube')?.value),
            twitter: normalizeUrl(document.getElementById('ob_twitter')?.value)
        };
    }
    
    churchOnboarding.step = Math.min(step + 1, 4);
    render();
}

function onboardingBack() {
    churchOnboarding.step = Math.max(churchOnboarding.step - 1, 1);
    render();
}

function onboardingSkip() {
    churchOnboarding.step = Math.min(churchOnboarding.step + 1, 4);
    render();
}

function cancelOnboarding() {
    // Clear the session and go back to church admin portal
    localStorage.removeItem('rooted_church_admin_session');

}

function onboardingEdit(step) {
    churchOnboarding.step = step;
    render();
}

function simulateWebsiteLookup() {
    const website = churchOnboarding.data.website;
    if (!website) return;
    
    // In a real app, this would call an API to scrape social links
    // For demo, we'll just show common patterns
    const domain = website.replace(/https?:\/\/(www\.)?/, '').replace(/\/$/, '');
    const name = domain.split('.')[0];
    
    // Auto-fill with common social patterns if empty
    if (!churchOnboarding.data.socialMedia.facebook) {
        churchOnboarding.data.socialMedia.facebook = `https://facebook.com/${name}`;
    }
    if (!churchOnboarding.data.socialMedia.instagram) {
        churchOnboarding.data.socialMedia.instagram = `https://instagram.com/${name}`;
    }
}

async function completeOnboarding() {
    const data = churchOnboarding.data;
    
    if (!data.name) {
        toast('Please enter a church name', 'error');
        churchOnboarding.step = 1;
        render();
        return;
    }
    
    // Show loading state
    toast('Setting up your church...', 'info');
    
    // Get church ID
    let churchId = churchOnboarding.churchId;
    
    if (!churchId) {
        // Generate from name if not set
        churchId = data.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
    }
    
    try {
        // Check if church exists in Firestore
        let churchExists = false;
        if (firebaseInitialized) {
            const existingChurch = await db.collection('churches').doc(churchId).get();
            churchExists = existingChurch.exists;
        }
        
        if (churchExists) {
            // Update existing church
            await ChurchDB.updateChurch(churchId, {
                name: data.name,
                address: data.address,
                phone: data.phone,
                website: data.website,
                socialMedia: data.socialMedia,
                onboarded: true
            });
        } else {
            // Create new church
            await ChurchDB.createChurch(churchId, {
                id: churchId,
                name: data.name,
                address: data.address,
                phone: data.phone,
                website: data.website,
                socialMedia: data.socialMedia,
                announcements: [],
                resources: [],
                checkInResources: [],
                enabledTools: ['seasons', 'spiritual-formation', 'bible-reading', 'prayer-journal', 'scripture-memory'],
                onboarded: true,
                memberCount: 0,
                maxMembers: churchOnboarding.maxMembers || 5,
                tier: churchOnboarding.tier || 'free'
            });
        }
        
        // Update admin account to mark as onboarded in Firestore
        if (churchOnboarding.adminUsername && firebaseInitialized) {
            await db.collection('church_admins').doc(churchOnboarding.adminUsername).update({
                onboarded: true,
                churchId: churchId
            });
        }
        
        // Also update local admin accounts
        if (churchOnboarding.adminUsername && CHURCH_ADMIN_ACCOUNTS[churchOnboarding.adminUsername]) {
            CHURCH_ADMIN_ACCOUNTS[churchOnboarding.adminUsername].onboarded = true;
            CHURCH_ADMIN_ACCOUNTS[churchOnboarding.adminUsername].churchId = churchId;
        }
        
        // Clear church cache to reload fresh data
        ChurchDB.clearCache();
        
        // Get fresh church data
        const church = await ChurchDB.getChurch(churchId);
        
        // Go to church admin dashboard
        State.set({ 
            screen: 'app', 
            accountType: 'church',
            user: { name: church.name, email: 'admin@' + churchId, churchId: churchId },
            activeNav: 'church-dashboard'
        });
        
        toast('🎉 Church setup complete! Welcome to Rooted!', 'success');
        
    } catch (error) {
        console.error('Onboarding error:', error);
        toast('Error completing setup: ' + error.message, 'error');
    }
}

// ========== AUTH HANDLERS ==========
async function handleGoogleSignIn() {
    try {
        await Auth.signInWithGoogle();
        await loadUserChurchData();
        toast('Welcome to Rooted! 🌱', 'success');
        State.set({ screen: 'app', user: Auth.currentUser, activeNav: 'dashboard' });
        startLocationTracking();
    } catch (e) {
        toast(e.message || 'Google sign-in failed', 'error');
    }
}

async function handleEmailSignIn(e) {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.textContent = 'Signing in...';
    
    try {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        await Auth.signInWithEmail(email, password);
        await loadUserChurchData();
        toast('Welcome back! 🌱', 'success');
        State.set({ screen: 'app', user: Auth.currentUser, activeNav: 'dashboard' });
        startLocationTracking();
    } catch (e) {
        toast(e.message || 'Sign in failed', 'error');
        btn.disabled = false;
        btn.textContent = 'Sign In';
    }
}

async function handleEmailSignUp(e) {
    e.preventDefault();
    const btn = document.getElementById('signupBtn');
    btn.disabled = true;
    btn.textContent = 'Creating account...';
    
    try {
        const name = document.getElementById('signupName').value;
        const email = document.getElementById('signupEmail').value;
        const password = document.getElementById('signupPassword').value;
        
        if (!firebaseInitialized) {
            const users = JSON.parse(localStorage.getItem('rooted_users') || '{}');
            if (users[email]) {
                throw new Error('Email already exists');
            }
        }
        
        await Auth.signUpWithEmail(email, password, name);
        
        if (!firebaseInitialized) {
            const users = JSON.parse(localStorage.getItem('rooted_users') || '{}');
            users[email].password = password;
            localStorage.setItem('rooted_users', JSON.stringify(users));
        }
        
        await loadUserChurchData();
        toast('Welcome to Rooted! 🌱', 'success');
        State.set({ screen: 'app', user: Auth.currentUser, activeNav: 'dashboard' });
        startLocationTracking();
    } catch (e) {
        toast(e.message || 'Sign up failed', 'error');
        btn.disabled = false;
        btn.textContent = 'Create Account';
    }
}

async function handlePasswordReset(e) {
    e.preventDefault();
    try {
        const email = document.getElementById('resetEmail').value;
        await Auth.resetPassword(email);
        toast('Password reset email sent!', 'success');
        State.set({ screen: 'login' });
    } catch (e) {
        toast(e.message || 'Failed to send reset email', 'error');
    }
}

async function handleSignOut() {
    stopLocationTracking();
    
    // Clear church admin session
    localStorage.removeItem('rooted_church_admin_session');
    
    // Clear user cache
    cachedUserChurches = [];
    cachedActiveChurch = null;
    
    await Auth.signOut();
    toast('Signed out', 'info');
    State.set({ screen: 'welcome', user: null, accountType: 'user' });
}

async function handleResourceUpload(e) {
    e.preventDefault();
    const title = document.getElementById('resourceTitle').value;
    const type = document.getElementById('resourceType').value;
    const file = document.getElementById('resourceFile').files[0];
    const btn = e.target.querySelector('button[type="submit"]');
    
    if (!file) {
        toast('Please select a file to upload', 'error');
        return;
    }
    
    // Show loading state
    btn.disabled = true;
    btn.textContent = 'Uploading...';
    showUploadOverlay('Uploading resource...', 0, 1);
    
    try {
        const churchId = State.current.user.churchId;
        
        updateUploadOverlay('Uploading file...', 0, 1);
        
        // Upload file to Firebase Storage
        const uploadResult = await ChurchDB.uploadFile(churchId, file, 'resources');
        
        updateUploadOverlay('Saving resource...', 1, 1);
        
        // Add resource to church data
        await ChurchDB.addResource(churchId, {
            title,
            type,
            url: uploadResult.url,
            fileName: uploadResult.fileName,
            path: uploadResult.path || null
        }, false);
        
        // Clear cache to force fresh data
        delete churchCache[churchId];
        
        hideUploadOverlay();
        toast('Resource uploaded successfully! 📄', 'success');
        
        // Clear form
        document.getElementById('resourceTitle').value = '';
        document.getElementById('resourceFile').value = '';
        
        render();
    } catch (error) {
        hideUploadOverlay();
        console.error('Upload error:', error);
        toast('Error uploading file: ' + error.message, 'error');
    } finally {
        btn.disabled = false;
        btn.textContent = 'Upload Resource';
    }
}

async function deleteResource(id) {
    const church = await ChurchDB.getChurchFresh(State.current.user.churchId);
    const resource = (church.resources || []).find(r => r.id === id);
    
    // Delete file from storage if it has a path
    if (resource && resource.path) {
        await ChurchDB.deleteFile(resource.path);
    }
    
    // Remove from church data
    await ChurchDB.deleteResource(State.current.user.churchId, id, false);
    
    // Clear cache
    delete churchCache[State.current.user.churchId];
    
    toast('Resource deleted', 'info');
    render();
}
