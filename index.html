            <div class="modal-header">
                <h3 class="modal-title">⚙️ ${church?.name || 'Church'}</h3>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body">
                <p style="color:var(--text-secondary);margin-bottom:var(--space-lg)">Manage your connection to this church.</p>
                
                <button class="btn btn-secondary btn-block" onclick="closeModal();switchChurch('${churchId}')" style="margin-bottom:var(--space-sm)">
                    ✓ Set as Active Church
                </button>
                
                <button class="btn btn-secondary btn-block" onclick="confirmRemoveChurch('${churchId}')" style="color:var(--error);border-color:var(--error)">
                    🗑️ Remove Church
                </button>
            </div>
        </div>
    `);
}

function confirmRemoveChurch(churchId) {
    const church = getChurchData(churchId);
    showModal(`
        <div class="modal" onclick="event.stopPropagation()" style="max-width:400px">
            <div class="modal-header">
                <h3 class="modal-title" style="color:var(--error)">Remove Church?</h3>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body">
                <p style="margin-bottom:var(--space-lg)">Are you sure you want to remove <strong>${church?.name || 'this church'}</strong> from your account?</p>
                <p style="font-size:0.85rem;color:var(--text-tertiary);margin-bottom:var(--space-lg)">You can always add it back later.</p>
                
                <div style="display:flex;gap:var(--space-md)">
                    <button class="btn btn-secondary" onclick="closeModal()" style="flex:1">Cancel</button>
                    <button class="btn btn-primary" onclick="removeChurchFromAccount('${churchId}')" style="flex:1;background:var(--error)">Remove</button>
                </div>
            </div>
        </div>
    `);
}

function removeChurchFromAccount(churchId) {
    if (Auth.currentUser) {
        removeUserChurch(Auth.currentUser.uid, churchId);
        closeModal();
        toast('Church removed', 'info');
        render();
    }
}

async function exportUserData() {
    const data = await UserDB.getUserData(Auth.currentUser.uid);
    const exportData = { profile: Auth.currentUser, data: data, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `rooted-backup-${new Date().toISOString().split('T')[0]}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toast('Data exported!', 'success');
}

function confirmDeleteAccount() {
    showModal(`
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 class="modal-title" style="color:var(--error)">⚠️ Delete Account</h3>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body">
                <p style="margin-bottom:var(--space-lg)">Are you sure? This cannot be undone.</p>
                <div class="input-group">
                    <label class="input-label">Type "DELETE" to confirm</label>
                    <input type="text" class="input-field" id="deleteConfirm" placeholder="DELETE">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" style="background:var(--error)" onclick="deleteAccount()">Delete Forever</button>
            </div>
        </div>
    `);
}

async function deleteAccount() {
    if (document.getElementById('deleteConfirm').value !== 'DELETE') {
        toast('Please type DELETE to confirm', 'error');
        return;
    }
    try {
        if (firebaseInitialized) {
            await db.collection('users').doc(Auth.currentUser.uid).delete();
            await auth.currentUser.delete();
        } else {
            const users = JSON.parse(localStorage.getItem('rooted_users') || '{}');
            delete users[Auth.currentUser.email];
            localStorage.setItem('rooted_users', JSON.stringify(users));
        }
        await Auth.signOut();
        closeModal();
        toast('Account deleted', 'info');
        State.set({ screen: 'welcome', user: null });
    } catch (e) {
        toast(e.message || 'Failed to delete account', 'error');
    }
}

function startQuiz() { quizState.screen = 'quiz'; renderQuiz(); }
function selectAnswer(i) { quizState.answer = i; renderQuiz(); }

function nextQuestion() {
    if (quizState.answer === null) return;
    const chars = QUESTIONS[quizState.qIndex].a[quizState.answer].chars;
    Object.entries(chars).forEach(([c, s]) => {
        quizState.scores[c] = (quizState.scores[c] || 0) + s;
    });
    if (quizState.qIndex < QUESTIONS.length - 1) {
        quizState.qIndex++;
        quizState.answer = null;
        renderQuiz();
    } else {
        quizState.screen = 'result';
        renderQuiz();
    }
}

    const savedNav = restoredState?.activeNav || localStorage.getItem('rooted_nav');
    
    // Check URL hash for superadmin access
    if (window.location.hash === '#superadmin' || window.location.hash === '#/superadmin') {
        showSuperAdminLogin();
        State.set({ screen: 'welcome' });
        return;
    }
    
    // Check for saved church admin session first
    const churchAdminSession = localStorage.getItem('rooted_church_admin_session');
    if (churchAdminSession) {
        try {
            const session = JSON.parse(churchAdminSession);
            // Load church data to verify session is still valid
            const church = await ChurchDB.getChurch(session.churchId);
            if (church) {
                // Determine nav - prefer restored state for church admin
                let activeNav = savedNav || 'church-dashboard';
                // Make sure it's a valid church admin nav
                const validChurchNavs = ['church-dashboard', 'church-members', 'church-resources', 
                    'church-checkin-resources', 'church-announcements', 'church-youtube', 
                    'church-social', 'church-branding', 'church-membership', 'church-location', 'church-tools'];
                if (!validChurchNavs.includes(activeNav)) {
                    activeNav = 'church-dashboard';
                }
                
                State.set({ 
                    screen: 'app', 
                    accountType: 'church',
                    user: { name: church.name, email: 'admin@' + session.churchId, churchId: session.churchId, adminUsername: session.username },
                    activeNav: activeNav
                });
                localStorage.removeItem('rooted_nav');
                return;
            } else {
                // Invalid session, clear it
                localStorage.removeItem('rooted_church_admin_session');
            }
        } catch (e) {
            console.log('Error restoring church admin session:', e);
            localStorage.removeItem('rooted_church_admin_session');
        }
    }
    
    // Check for regular user session
    const user = await Auth.init();
    if (user) {
        // CRITICAL: Load user's church connections
        await loadUserChurchData();
        
        // Determine nav - prefer restored state for regular user
        let activeNav = savedNav || 'dashboard';
        // Make sure it's a valid user nav
        const validUserNavs = ['dashboard', 'my-church', 'church-videos', 'tools', 'progress', 'profile', 'settings'];
        if (!validUserNavs.includes(activeNav)) {
            activeNav = 'dashboard';
        }
        
        localStorage.removeItem('rooted_nav');
        State.set({ screen: 'app', user, activeNav });
    } else {
        State.set({ screen: 'welcome' });
    }
}

// Listen for hash changes (for superadmin access)
window.addEventListener('hashchange', () => {
    if (window.location.hash === '#superadmin' || window.location.hash === '#/superadmin') {
        showSuperAdminLogin();
    }
});

init();
</script>
