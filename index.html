async function handlePostSubmit(e) {
    e.preventDefault();
    
    // Check if user is logged in and has a church
    if (!State.current.user?.churchId) {
        toast('Error: No church connected. Please log in as church admin.', 'error');
        console.error('No churchId found:', State.current.user);
        return;
    }
    
    const type = document.getElementById('postType')?.value || 'text';
    const title = document.getElementById('postTitle')?.value?.trim() || '';
    const content = document.getElementById('postContent')?.value?.trim() || '';
    const videoUrl = document.getElementById('postVideoUrl')?.value?.trim() || '';
    const imageFile = document.getElementById('postImageFile')?.files?.[0];
    
    if (!content) {
        toast('Please enter some content', 'error');
        return;
    }
    
    const btn = document.getElementById('postSubmitBtn');
    if (btn) {
        btn.disabled = true;
        btn.textContent = 'Posting...';
    }
    
    // Show upload overlay for image posts
    if (type === 'image' && imageFile) {
        showUploadOverlay('Uploading image...', 0, 1);
    }
    
    try {
        let imageUrl = null;
        let videoId = null;
        const churchId = State.current.user.churchId;
        
        // Upload image if present
        if (type === 'image' && imageFile) {
            try {
                updateUploadOverlay('Compressing image...', 0, 1);
                
                // Compress the image first
                const compressedData = await compressImageAsync(imageFile, 1600, 0.8);
                
                updateUploadOverlay('Uploading to server...', 0, 1);
                
                const storageRef = firebase.storage().ref();
                const fileName = `${Date.now()}_${imageFile.name.replace(/[^a-zA-Z0-9.]/g, '_')}`;
                const imageRef = storageRef.child(`churches/${churchId}/posts/${fileName}`);
                
                // Convert base64 to blob for upload
                const response = await fetch(compressedData);
                const blob = await response.blob();
                
                const snapshot = await imageRef.put(blob);
                imageUrl = await snapshot.ref.getDownloadURL();
                
                updateUploadOverlay('Upload complete!', 1, 1);
                hideUploadOverlay();
            } catch (uploadError) {
                hideUploadOverlay();
                console.error('Image upload error:', uploadError);
                toast('Error uploading image: ' + (uploadError.message || 'Unknown error'), 'error');
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = '📤 Post';
                }
                return;
            }
        }
        
        // Extract video ID
        if (type === 'video' && videoUrl) {
            videoId = extractYouTubeId(videoUrl);
            if (!videoId) {
                toast('Invalid YouTube URL', 'error');
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = '📤 Post';
                }
                return;
            }
        }
        
        // Create post object
        const post = {
            id: Date.now().toString(),
            type: type,
            title: title,
            content: content,
            imageUrl: imageUrl,
            videoId: videoId,
            videoUrl: videoUrl,
            createdAt: new Date().toISOString(),
            createdBy: Auth.currentUser?.uid || 'admin'
        };
        
        console.log('Creating post:', post);
        
        // Save to Firebase
        const church = await ChurchDB.getChurchFresh(churchId);
        if (!church) {
            toast('Error: Church not found', 'error');
            return;
        }
        
        const posts = church.posts || [];
        posts.unshift(post);
        
        await ChurchDB.updateChurch(churchId, { posts: posts });
        delete churchCache[churchId];
        
        // Clear form
        const titleInput = document.getElementById('postTitle');
        const contentInput = document.getElementById('postContent');
        const videoInput = document.getElementById('postVideoUrl');
        const imageInput = document.getElementById('postImageFile');
        const previewDiv = document.getElementById('imagePreview');
        
        if (titleInput) titleInput.value = '';
        if (contentInput) contentInput.value = '';
        if (videoInput) videoInput.value = '';
        if (imageInput) imageInput.value = '';
        if (previewDiv) previewDiv.style.display = 'none';
        
        toast('Post published! 📝', 'success');
        render();
    } catch (error) {
        console.error('Error posting:', error);
        toast('Error publishing post: ' + (error.message || 'Unknown error'), 'error');
    } finally {
        if (btn) {
            btn.disabled = false;
            btn.textContent = '📤 Post';
        }
    }
}

async function deletePost(postId) {
    if (!confirm('Delete this post?')) return;
    
    try {
        const church = await ChurchDB.getChurchFresh(State.current.user.churchId);
        const posts = (church.posts || []).filter(p => p.id !== postId);
        
        // Also unpin if this was the pinned post
        const updates = { posts: posts };
        if (church.pinnedPostId === postId) {
            updates.pinnedPostId = null;
        }
        
        await ChurchDB.updateChurch(State.current.user.churchId, updates);
        delete churchCache[State.current.user.churchId];
        
        toast('Post deleted', 'info');
        render();
    } catch (error) {
        console.error('Error deleting post:', error);
        toast('Error deleting post', 'error');
    }
}

async function togglePinPost(postId) {
    try {
        const church = await ChurchDB.getChurchFresh(State.current.user.churchId);
        const currentPinned = church.pinnedPostId;
        
        // Toggle: if already pinned, unpin; otherwise pin this one
        const newPinnedId = currentPinned === postId ? null : postId;
        
        await ChurchDB.updateChurch(State.current.user.churchId, { pinnedPostId: newPinnedId });
        delete churchCache[State.current.user.churchId];
        
        toast(newPinnedId ? 'Post pinned to top! 📌' : 'Post unpinned', 'success');
        render();
    } catch (error) {
        console.error('Error pinning post:', error);
        toast('Error updating pin status', 'error');
    }
}

function formatPostDate(isoDate) {
    if (!isoDate) return '';
    const date = new Date(isoDate);
    const now = new Date();
    const diff = now - date;
    
    if (diff < 60000) return 'Just now';
    if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
    if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
    if (diff < 604800000) return Math.floor(diff / 86400000) + 'd ago';
    
    return date.toLocaleDateString();
}

async function addYouTubeChannel() {
    const url = document.getElementById('newChannelUrl')?.value?.trim();
    const name = document.getElementById('newChannelName')?.value?.trim();
    
    if (!url) {
        toast('Please enter a YouTube channel URL', 'error');
        return;
    }
    
    // Extract channel identifier
    let channelId = 'ch_' + Date.now();
    let channelName = name || url;
    
    if (url.includes('/@')) {
        const match = url.match(/@([^\/\?]+)/);
        if (match) {
            channelId = 'ch_' + match[1];
            if (!name) channelName = '@' + match[1];
        }
    } else if (url.includes('/channel/')) {
        const match = url.match(/\/channel\/([^\/\?]+)/);
        if (match) channelId = 'ch_' + match[1];
    }
    
    try {
        const church = await ChurchDB.getChurchFresh(State.current.user.churchId);
        const channels = church.ytChannels || [];
        
        // Check for duplicates
        if (channels.find(c => c.url === url)) {
            toast('This channel is already added', 'error');
            return;
        }
        
        channels.push({
            id: channelId,
            name: channelName,
            url: url,
            addedAt: new Date().toISOString()
        });
        
        await ChurchDB.updateChurch(State.current.user.churchId, { ytChannels: channels });
        
        // Clear cache and update with fresh data
        delete churchCache[State.current.user.churchId];
        const freshData = await ChurchDB.getChurchFresh(State.current.user.churchId);
        churchCache[State.current.user.churchId] = freshData;
        
        // Clear form
        document.getElementById('newChannelUrl').value = '';
        document.getElementById('newChannelName').value = '';
        
        toast('Channel added! Now add playlists from it. 🎬', 'success');
        render();
    } catch (e) {
        console.error('Error adding channel:', e);
        toast('Error adding channel', 'error');
    }
}

async function deleteYouTubeChannel(channelId) {
    if (!confirm('Delete this channel and all its playlists?')) return;
    
    try {
        const church = await ChurchDB.getChurchFresh(State.current.user.churchId);
        const channels = (church.ytChannels || []).filter(c => c.id !== channelId);
        const playlists = (church.ytPlaylists || []).filter(p => p.channelId !== channelId);
        const videos = (church.ytVideos || []).filter(v => {
            const playlist = (church.ytPlaylists || []).find(p => p.id === v.playlistId);
            return !playlist || playlist.channelId !== channelId;
        });
        
        await ChurchDB.updateChurch(State.current.user.churchId, { 
            ytChannels: channels,
            ytPlaylists: playlists,
            ytVideos: videos
        });
        delete churchCache[State.current.user.churchId];
        
        toast('Channel deleted', 'info');
        render();
    } catch (e) {
        console.error('Error deleting channel:', e);
        toast('Error deleting channel', 'error');
    }
}

async function addPlaylistToChannel(channelId) {
    const url = document.getElementById(`playlistUrl_${channelId}`)?.value?.trim();
    const name = document.getElementById(`playlistName_${channelId}`)?.value?.trim();
    
    if (!url || !name) {
        toast('Please enter both playlist URL and name', 'error');
        return;
    }
    
    // Extract playlist ID from URL
    const match = url.match(/[?&]list=([^&]+)/);
    if (!match) {
        toast('Invalid playlist URL. Make sure it contains "list="', 'error');
        return;
    }
    
    const playlistId = match[1];
    
    try {
        const church = await ChurchDB.getChurchFresh(State.current.user.churchId);
        const playlists = church.ytPlaylists || [];
        
        // Check for duplicates
        if (playlists.find(p => p.id === playlistId)) {
            toast('This playlist is already added', 'error');
            return;
        }
        
        toast('Fetching videos from YouTube...', 'info');
        
        // Fetch videos from YouTube playlist
        const videos = await fetchYouTubePlaylistVideos(playlistId, name);
        
        // Get first video thumbnail for playlist
        const firstVideoId = videos.length > 0 ? videos[0].videoId : null;
        const thumbnail = firstVideoId 
            ? `https://img.youtube.com/vi/${firstVideoId}/mqdefault.jpg`
            : null;
        
        playlists.push({
            id: playlistId,
            channelId: channelId,
            name: name,
            url: url,
            thumbnail: thumbnail,
            videoCount: videos.length,
            enabled: true,
            addedAt: new Date().toISOString()
        });
        
        // Add videos to church ytVideos
        const existingVideos = church.ytVideos || [];
        const newVideos = videos.map(v => ({
            ...v,
            playlistId: playlistId,
            playlistName: name
        }));
        
        await ChurchDB.updateChurch(State.current.user.churchId, { 
            ytPlaylists: playlists,
            ytVideos: [...existingVideos, ...newVideos]
        });
        
        // Clear cache and refresh
        delete churchCache[State.current.user.churchId];
        const freshData = await ChurchDB.getChurchFresh(State.current.user.churchId);
        churchCache[State.current.user.churchId] = freshData;
        
        // Clear form
        document.getElementById(`playlistUrl_${channelId}`).value = '';
        document.getElementById(`playlistName_${channelId}`).value = '';
        
        toast(`Playlist added with ${videos.length} videos! 🎬`, 'success');
        render();
    } catch (e) {
        console.error('Error adding playlist:', e);
        toast('Error adding playlist: ' + e.message, 'error');
    }
}

// Fetch videos from a YouTube playlist using RSS feed
async function fetchYouTubePlaylistVideos(playlistId, playlistName) {
    const videos = [];
    
    try {
        // Try YouTube RSS feed first (works for public playlists)
        const rssUrl = `https://www.youtube.com/feeds/videos.xml?playlist_id=${playlistId}`;
        
        // Use a CORS proxy since YouTube doesn't allow direct browser access
        const proxyUrls = [
            `https://api.allorigins.win/raw?url=${encodeURIComponent(rssUrl)}`,
            `https://corsproxy.io/?${encodeURIComponent(rssUrl)}`,
            `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(rssUrl)}`
        ];
        
        let xmlText = null;
        
        for (const proxyUrl of proxyUrls) {
            try {
                const response = await fetch(proxyUrl, { 
                    method: 'GET',
                    headers: { 'Accept': 'application/xml, text/xml, */*' }
                });
                if (response.ok) {
                    xmlText = await response.text();
                    if (xmlText && xmlText.includes('<entry>')) {
                        break;
                    }
                }
            } catch (e) {
                console.log('Proxy failed:', proxyUrl, e);
                continue;
            }
        }
        
        if (xmlText && xmlText.includes('<entry>')) {
            // Parse the RSS XML
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
            const entries = xmlDoc.querySelectorAll('entry');
            
            entries.forEach((entry, index) => {
                const videoId = entry.querySelector('yt\\:videoId, videoId')?.textContent;
                const title = entry.querySelector('title')?.textContent;
                const published = entry.querySelector('published')?.textContent;
                
                if (videoId && title) {
                    videos.push({
                        id: `${playlistId}_${videoId}_${Date.now()}_${index}`,
                        videoId: videoId,
                        title: title,
                        date: published ? new Date(published).toLocaleDateString() : new Date().toLocaleDateString(),
                        addedAt: new Date().toISOString()
                    });
                }
            });
        }
        
        // If RSS didn't work, try scraping the playlist page
        if (videos.length === 0) {
            console.log('RSS feed empty, trying page scrape...');
            const pageVideos = await scrapeYouTubePlaylistPage(playlistId);
            videos.push(...pageVideos);
        }
        
    } catch (e) {
        console.error('Error fetching playlist:', e);
    }
    
    // If still no videos, return empty array (admin can add manually)
    if (videos.length === 0) {
        console.log('Could not auto-fetch videos. Admin will need to add manually.');
    }
    
    return videos;
}

// Fallback: scrape YouTube playlist page for video IDs
async function scrapeYouTubePlaylistPage(playlistId) {
    const videos = [];
    
    try {
        const playlistUrl = `https://www.youtube.com/playlist?list=${playlistId}`;
        const proxyUrls = [
            `https://api.allorigins.win/raw?url=${encodeURIComponent(playlistUrl)}`,
            `https://corsproxy.io/?${encodeURIComponent(playlistUrl)}`
        ];
        
        let html = null;
        
        for (const proxyUrl of proxyUrls) {
            try {
                const response = await fetch(proxyUrl);
                if (response.ok) {
                    html = await response.text();
                    if (html && html.includes('videoId')) {
                        break;
                    }
                }
            } catch (e) {
                continue;
            }
        }
        
        if (html) {
            // Extract video IDs and titles from the page
            // YouTube stores video data in a JSON object in the page
            const videoIdMatches = html.match(/"videoId":"([a-zA-Z0-9_-]{11})"/g) || [];
            const titleMatches = html.match(/"title":\{"runs":\[\{"text":"([^"]+)"\}\]/g) || [];
            
            const seenIds = new Set();
            videoIdMatches.forEach((match, index) => {
                const videoId = match.match(/"videoId":"([a-zA-Z0-9_-]{11})"/)?.[1];
                if (videoId && !seenIds.has(videoId)) {
                    seenIds.add(videoId);
                    
                    // Try to get corresponding title
                    let title = `Video ${videos.length + 1}`;
                    if (titleMatches[index]) {
                        const titleMatch = titleMatches[index].match(/"text":"([^"]+)"/);
                        if (titleMatch) title = titleMatch[1];
                    }
                    
                    videos.push({
                        id: `${playlistId}_${videoId}_${Date.now()}_${videos.length}`,
                        videoId: videoId,
                        title: title,
                        date: new Date().toLocaleDateString(),
                        addedAt: new Date().toISOString()
                    });
                }
            });
        }
    } catch (e) {
        console.error('Error scraping playlist page:', e);
    }
    
    return videos;
}

// Refresh/sync videos from YouTube playlist
async function refreshPlaylistVideos(playlistId, playlistName) {
    toast('Syncing videos from YouTube...', 'info');
    
    try {
        const church = await ChurchDB.getChurchFresh(State.current.user.churchId);
        const playlists = church.ytPlaylists || [];
        const existingVideos = church.ytVideos || [];
        
        // Fetch fresh videos from YouTube
        const freshVideos = await fetchYouTubePlaylistVideos(playlistId, playlistName);
        
        if (freshVideos.length === 0) {
            toast('Could not fetch videos from YouTube. Try again later.', 'error');
            return;
        }
        
        // Remove old videos from this playlist
        const otherVideos = existingVideos.filter(v => v.playlistId !== playlistId);
        
        // Add fresh videos with playlist info
        const newVideos = freshVideos.map(v => ({
            ...v,
            playlistId: playlistId,
            playlistName: playlistName
        }));
        
        // Update playlist video count and thumbnail
        const playlistIndex = playlists.findIndex(p => p.id === playlistId);
        if (playlistIndex !== -1) {
            playlists[playlistIndex].videoCount = newVideos.length;
            if (newVideos.length > 0) {
                playlists[playlistIndex].thumbnail = `https://img.youtube.com/vi/${newVideos[0].videoId}/mqdefault.jpg`;
            }
        }
        
        await ChurchDB.updateChurch(State.current.user.churchId, { 
            ytPlaylists: playlists,
            ytVideos: [...otherVideos, ...newVideos]
        });
        
        // Refresh cache and UI
        delete churchCache[State.current.user.churchId];
        const freshData = await ChurchDB.getChurchFresh(State.current.user.churchId);
        churchCache[State.current.user.churchId] = freshData;
        
        toast(`Synced ${newVideos.length} videos! 🎬`, 'success');
        render();
    } catch (e) {
        console.error('Error refreshing playlist:', e);
        toast('Error syncing videos', 'error');
    }
}

function extractYouTubeId(url) {
    if (!url) return '';
    const match = url.match(/(?:youtu\.be\/|youtube\.com(?:\/embed\/|\/v\/|\/watch\?v=|\/watch\?.+&v=|\/shorts\/))([^&?\s]+)/);
    return match ? match[1] : '';
}

async function addVideoToPlaylist(playlistId) {
    const url = document.getElementById('newVideoUrl')?.value?.trim();
    const title = document.getElementById('newVideoTitle')?.value?.trim();
    
    if (!url) {
        toast('Please enter a video URL', 'error');
        return;
    }
    
    const videoId = extractYouTubeId(url);
    if (!videoId) {
        toast('Invalid YouTube URL', 'error');
        return;
    }
    
    const videoTitle = title || 'Untitled Video';
    
    try {
        const church = await ChurchDB.getChurchFresh(State.current.user.churchId);
        const videos = church.ytVideos || [];
        const playlists = church.ytPlaylists || [];
        
        // Check for duplicates
        if (videos.find(v => v.videoId === videoId && v.playlistId === playlistId)) {
            toast('This video is already in this playlist', 'error');
            return;
        }
        
        videos.unshift({
            id: Date.now().toString(),
            videoId: videoId,
            title: videoTitle,
            playlistId: playlistId,
            url: url,
            date: new Date().toLocaleDateString(),
            addedAt: new Date().toISOString()
        });
        
        // Update video count for playlist
        const playlistIndex = playlists.findIndex(p => p.id === playlistId);
        if (playlistIndex !== -1) {
            playlists[playlistIndex].videoCount = videos.filter(v => v.playlistId === playlistId).length;
            // Update thumbnail to first video
            playlists[playlistIndex].thumbnail = `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`;
        }
        
        await ChurchDB.updateChurch(State.current.user.churchId, { 
            ytVideos: videos,
            ytPlaylists: playlists
        });
        delete churchCache[State.current.user.churchId];
        
        // Clear inputs
        document.getElementById('newVideoUrl').value = '';
        document.getElementById('newVideoTitle').value = '';
        
        toast('Video added! 🎬', 'success');
        
        // Refresh modal
        managePlaylistVideos(playlistId);
    } catch (e) {
        console.error('Error adding video:', e);
        toast('Error adding video', 'error');
    }
}

async function deleteVideo(videoId, playlistId) {
    try {
        const church = await ChurchDB.getChurchFresh(State.current.user.churchId);
        const videos = (church.ytVideos || []).filter(v => v.id !== videoId);
        const playlists = church.ytPlaylists || [];
        
        // Update video count for playlist
        const playlistIndex = playlists.findIndex(p => p.id === playlistId);
        if (playlistIndex !== -1) {
            playlists[playlistIndex].videoCount = videos.filter(v => v.playlistId === playlistId).length;
        }
        
        await ChurchDB.updateChurch(State.current.user.churchId, { 
            ytVideos: videos,
            ytPlaylists: playlists
        });
        delete churchCache[State.current.user.churchId];
        
        toast('Video removed', 'info');
        managePlaylistVideos(playlistId);
    } catch (e) {
        console.error('Error deleting video:', e);
        toast('Error removing video', 'error');
    }
}

async function saveMembershipConfig(e) {
    if (e) e.preventDefault();
    
    const form = document.getElementById('membershipForm');
    if (!form) {
        toast('Form not found', 'error');
        return;
    }
    
    // Get selected methods using querySelectorAll
    const methodCheckboxes = form.querySelectorAll('input[name="method"]:checked');
    const methods = Array.from(methodCheckboxes).map(cb => cb.value);
    
    // Get field values directly from form elements
    const email = form.querySelector('#membershipEmail')?.value?.trim() || '';
    const url = form.querySelector('#membershipUrl')?.value?.trim() || '';
    const phone = form.querySelector('#membershipPhone')?.value?.trim() || '';
    
    // Build config object
    const membershipConfig = {
        methods: methods,
        email: email,
        url: url,
        phone: phone,
        updatedAt: new Date().toISOString()
    };
    
    console.log('Saving membership config:', membershipConfig);
    
    try {
        // Save to Firebase
        await ChurchDB.updateChurch(State.current.user.churchId, { membershipConfig: membershipConfig });
        
        // Clear cache to ensure fresh data on next load
        delete churchCache[State.current.user.churchId];
        
        toast('Membership settings saved! ✨', 'success');
        
        // Re-render to show updated values
        render();
    } catch (e) {
        console.error('Error saving membership config:', e);
        toast('Error saving settings: ' + e.message, 'error');
    }
}

// Toggle membership status (admin only)
async function toggleMemberStatus(userId, makeMember) {
    const action = makeMember ? 'grant membership to' : 'remove membership from';
    const userName = allMembersData.find(m => m.id === userId)?.name || 'this user';
    
    if (!confirm(`Are you sure you want to ${action} ${userName}?`)) {
        return;
    }
    
    showUploadOverlay(makeMember ? 'Granting membership...' : 'Removing membership...', 0, 1);
    
    try {
        // Update the user's isMember status in Firestore
        await db.collection('users').doc(userId).set({
            isMember: makeMember,
            membershipUpdatedAt: firebase.firestore.FieldValue.serverTimestamp(),
            membershipUpdatedBy: State.current.user?.churchId || 'admin'
        }, { merge: true });
        
        // Update local data
        const memberIndex = allMembersData.findIndex(m => m.id === userId);
        if (memberIndex !== -1) {
            allMembersData[memberIndex].isMember = makeMember;
        }
        
        // Update stats
        const claimedMembers = allMembersData.filter(m => m.isMember).length;
        const claimedEl = document.getElementById('claimedMemberCount');
        if (claimedEl) claimedEl.textContent = claimedMembers.toString();
        
        // Re-render the list
        const container = document.getElementById('membersList');
        if (container) {
            renderMembersList(container, allMembersData);
        }
        
        hideUploadOverlay();
        toast(makeMember ? `${userName} is now a member! ✓` : `Membership removed from ${userName}`, 'success');
        
    } catch (e) {
        hideUploadOverlay();
        console.error('Error updating membership:', e);
        toast('Error updating membership status', 'error');
    }
}

async function loadChurchMembers(churchId) {
    const container = document.getElementById('membersList');
    if (!container) return;
    
    if (!firebaseInitialized) {
        container.innerHTML = '<p style="color:var(--text-tertiary);text-align:center">Firebase not connected. Cannot load members.</p>';
        return;
    }
    
    // Show loading state
    container.innerHTML = `
        <div style="text-align:center;padding:var(--space-xl)">
            <div class="loading-spinner" style="width:32px;height:32px;margin:0 auto var(--space-md)"></div>
            <p style="color:var(--text-tertiary)">Loading members...</p>
        </div>
    `;
    
    try {
        // First try the members subcollection
        let members = [];
        
        try {
            const snapshot = await db.collection('churches').doc(churchId).collection('members').orderBy('joinedAt', 'desc').get();
            
            if (!snapshot.empty) {
                // Get user details for each member
                const memberPromises = snapshot.docs.map(async (doc) => {
                    const memberData = doc.data();
                    try {
                        const userDoc = await db.collection('users').doc(doc.id).get();
                        const userData = userDoc.exists ? userDoc.data() : {};
                        
                        // Count check-ins for this church
                        const checkInHistory = userData.checkInHistory || [];
                        const churchCheckIns = checkInHistory.filter(c => c.churchId === churchId);
                        
                        // Parse name into first/last
                        const fullName = userData.name || userData.displayName || 'Unknown User';
                        const nameParts = fullName.trim().split(' ');
                        const firstName = nameParts[0] || '';
                        const lastName = nameParts.length > 1 ? nameParts.slice(1).join(' ') : '';
                        
                        return {
                            id: doc.id,
                            ...memberData,
                            name: fullName,
                            firstName: firstName,
                            lastName: lastName,
                            email: userData.email || '',
                            phone: userData.phone || '',
                            address: userData.address || '',
                            isMember: userData.isMember || false,
                            checkInCount: churchCheckIns.length
                        };
                    } catch (e) {
                        console.error('Error loading user data:', e);
                        return {
                            id: doc.id,
                            ...memberData,
                            name: 'Unknown User',
                            firstName: 'Unknown',
                            lastName: '',
                            email: '',
                            phone: '',
                            address: '',
                            isMember: false,
                            checkInCount: 0
                        };
                    }
                });
                
                members = await Promise.all(memberPromises);
            }
        } catch (subError) {
            console.log('Members subcollection query failed, trying alternative:', subError.message);
        }
        
        // If no members found via subcollection, try querying users directly
        if (members.length === 0) {
            console.log('Trying alternative query: users with churches array containing', churchId);
            try {
                const usersSnapshot = await db.collection('users').where('churches', 'array-contains', churchId).get();
                
                if (!usersSnapshot.empty) {
                    members = usersSnapshot.docs.map(doc => {
                        const userData = doc.data();
                        const fullName = userData.name || userData.displayName || 'Unknown User';
                        const nameParts = fullName.trim().split(' ');
                        const firstName = nameParts[0] || '';
                        const lastName = nameParts.length > 1 ? nameParts.slice(1).join(' ') : '';
                        
                        // Count check-ins for this church
                        const checkInHistory = userData.checkInHistory || [];
                        const churchCheckIns = checkInHistory.filter(c => c.churchId === churchId);
                        
                        return {
                            id: doc.id,
                            name: fullName,
                            firstName: firstName,
                            lastName: lastName,
                            email: userData.email || '',
                            phone: userData.phone || '',
                            address: userData.address || '',
                            isMember: userData.isMember || false,
                            checkInCount: churchCheckIns.length,
                            joinedAt: userData.createdAt || null
                        };
                    });
                    
                    // Also add them to the members subcollection for future queries
                    for (const member of members) {
                        try {
                            await db.collection('churches').doc(churchId).collection('members').doc(member.id).set({
                                joinedAt: member.joinedAt || new Date().toISOString(),
                                userId: member.id
                            }, { merge: true });
                        } catch (e) {
                            // Ignore errors adding to subcollection
                        }
                    }
                }
            } catch (altError) {
                console.error('Alternative query also failed:', altError);
            }
        }
        
        if (members.length === 0) {
            container.innerHTML = '<p style="color:var(--text-tertiary);text-align:center;padding:var(--space-xl)">No members have joined yet. Share your church\'s access code to invite members!</p>';
            // Update stats
            const claimedEl = document.getElementById('claimedMemberCount');
            const checkInsEl = document.getElementById('totalCheckInsCount');
            if (claimedEl) claimedEl.textContent = '0';
            if (checkInsEl) checkInsEl.textContent = '0';
            return;
        }
        
        // Sort by last name, then first name
        members.sort((a, b) => {
            const lastCompare = (a.lastName || '').localeCompare(b.lastName || '');
            if (lastCompare !== 0) return lastCompare;
            return (a.firstName || '').localeCompare(b.firstName || '');
        });
        
        // Store for filtering
        allMembersData = members;
        
        // Calculate stats
        const claimedMembers = members.filter(m => m.isMember).length;
        const totalCheckIns = members.reduce((sum, m) => sum + (m.checkInCount || 0), 0);
        
        // Update stat cards
        const claimedEl = document.getElementById('claimedMemberCount');
        const checkInsEl = document.getElementById('totalCheckInsCount');
        if (claimedEl) claimedEl.textContent = claimedMembers.toString();
        if (checkInsEl) checkInsEl.textContent = totalCheckIns.toString();
        
        // Render member list
        renderMembersList(container, members);
        
    } catch (e) {
        console.error('Error loading members:', e);
        container.innerHTML = `<p style="color:var(--error);text-align:center">Error loading members: ${e.message || 'Unknown error'}. Please try again.</p>`;
    }
}

async function handleCheckInResourceUpload(e) {
    e.preventDefault();
    const title = document.getElementById('checkinResourceTitle').value;
    const type = document.getElementById('checkinResourceType').value;
    const file = document.getElementById('checkinResourceFile').files[0];
    const btn = e.target.querySelector('button[type="submit"]');
    
    if (!file) {
        toast('Please select a file to upload', 'error');
        return;
    }
    
    // Show loading state
    btn.disabled = true;
    btn.textContent = 'Uploading...';
    toast('Uploading file...', 'info');
    
    try {
        const churchId = State.current.user.churchId;
        
        // Upload file to Firebase Storage
        const uploadResult = await ChurchDB.uploadFile(churchId, file, 'checkin-resources');
        
        // Add resource to church data
        await ChurchDB.addResource(churchId, {
            title,
            type,
            url: uploadResult.url,
            fileName: uploadResult.fileName,
            path: uploadResult.path || null
        }, true); // true = isCheckIn
        
        // Clear cache
        delete churchCache[churchId];
        
        toast('Check-in resource added! 📍', 'success');
        
        // Clear form
        document.getElementById('checkinResourceTitle').value = '';
        document.getElementById('checkinResourceFile').value = '';
        
        render();
    } catch (error) {
        console.error('Upload error:', error);
        toast('Error uploading file: ' + error.message, 'error');
    } finally {
        btn.disabled = false;
        btn.textContent = 'Add Check-In Resource';
    }
}

async function deleteCheckInResource(id) {
    const church = await ChurchDB.getChurchFresh(State.current.user.churchId);
    const resource = (church.checkInResources || []).find(r => r.id === id);
    
    // Delete file from storage if it has a path
    if (resource && resource.path) {
        await ChurchDB.deleteFile(resource.path);
    }
    
    // Remove from church data
    await ChurchDB.deleteResource(State.current.user.churchId, id, true); // true = isCheckIn
    
    // Clear cache
    delete churchCache[State.current.user.churchId];
    
    toast('Check-in resource deleted', 'info');
    render();
}

// Geocode address to coordinates using OpenStreetMap Nominatim (free, no API key needed)
async function geocodeAddress() {
    const address = document.getElementById('locationAddress').value.trim();
    if (!address) {
        toast('Please enter an address first', 'error');
        return;
    }
    
    const statusEl = document.getElementById('geocodeStatus');
    const msgEl = document.getElementById('geocodeMessage');
    statusEl.style.display = 'block';
    statusEl.style.background = 'var(--hover-bg)';
    msgEl.innerHTML = '🔍 Looking up address...';
    
    try {
        // Use OpenStreetMap Nominatim API (free, no key required)
        const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&limit=1`, {
            headers: { 'User-Agent': 'RootedChurchApp/1.0' }
        });
        
        const results = await response.json();
        
        if (results && results.length > 0) {
            const result = results[0];
            const lat = parseFloat(result.lat);
            const lng = parseFloat(result.lon);
            
            document.getElementById('locationLat').value = lat.toFixed(6);
            document.getElementById('locationLng').value = lng.toFixed(6);
            
            statusEl.style.background = 'linear-gradient(135deg,var(--success),#16a34a)';
            msgEl.innerHTML = `<span style="color:white">✓ Found: ${result.display_name.split(',').slice(0, 3).join(', ')}</span>`;
            
            toast('Address found! Click Save to confirm.', 'success');
        } else {
            statusEl.style.background = 'var(--warning)';
            msgEl.innerHTML = `<span style="color:white">⚠️ Could not find that address. Try a more specific address with city and state.</span>`;
            toast('Address not found', 'error');
        }
    } catch (error) {
        console.error('Geocoding error:', error);
        statusEl.style.background = 'var(--error)';
        msgEl.innerHTML = `<span style="color:white">❌ Error looking up address. Please try again.</span>`;
        toast('Error geocoding address', 'error');
    }
}

function handleLocationUpdate(e) {
    e.preventDefault();
    const address = document.getElementById('locationAddress').value;
    const latitude = parseFloat(document.getElementById('locationLat').value);
    const longitude = parseFloat(document.getElementById('locationLng').value);
    
    if (isNaN(latitude) || isNaN(longitude)) {
        toast('Please click "Find Location" to get coordinates from your address', 'error');
        return;
    }
    
    updateChurchData(State.current.user.churchId, { address, latitude, longitude });
    delete churchCache[State.current.user.churchId];
    toast('Church location saved! Geofencing is now active. 🗺️', 'success');
    render();
}

function getCurrentLocation() {
    if (!navigator.geolocation) {
        toast('Geolocation not supported by your browser', 'error');
        return;
    }
    
    toast('Getting your location...', 'info');
    
    navigator.geolocation.getCurrentPosition(
        (position) => {
            document.getElementById('locationLat').value = position.coords.latitude.toFixed(6);
            document.getElementById('locationLng').value = position.coords.longitude.toFixed(6);
            toast('Location found! Click Save to confirm.', 'success');
        },
        (error) => {
            toast('Could not get location: ' + error.message, 'error');
        },
        { enableHighAccuracy: true }
    );
}

// ========== STORAGE MANAGEMENT ==========
const USER_STORAGE_LIMIT_MB = 50; // 50 MB per user
const USER_STORAGE_LIMIT_BYTES = USER_STORAGE_LIMIT_MB * 1024 * 1024;
const STORAGE_WARNING_THRESHOLD = 0.75; // Warn at 75%

function calculateStorageUsed() {
    let totalBytes = 0;
    
    // Calculate notes storage (including images)
    const notes = JSON.parse(localStorage.getItem('rooted_notes') || '[]');
    notes.forEach(note => {
        // Text content
        totalBytes += new Blob([note.title || '']).size;
        totalBytes += new Blob([note.content || '']).size;
        totalBytes += new Blob([note.source || '']).size;
        totalBytes += new Blob([note.date || '']).size;
        
        // Images (base64 data)
        if (note.images && note.images.length) {
            note.images.forEach(img => {
                if (img.data) {
                    // Base64 string size
                    totalBytes += img.data.length;
                }
            });
        }
    });
    
    // Calculate tool history storage
    const toolHistory = JSON.parse(localStorage.getItem('rooted_tool_history') || '[]');
    totalBytes += new Blob([JSON.stringify(toolHistory)]).size;
    
    // Calculate user prefs storage
    const userPrefs = JSON.parse(localStorage.getItem('rooted_user_prefs') || '{}');
    totalBytes += new Blob([JSON.stringify(userPrefs)]).size;
    
    // Calculate tool results storage
    const toolResults = JSON.parse(localStorage.getItem('rooted_tool_results') || '{}');
    totalBytes += new Blob([JSON.stringify(toolResults)]).size;
    
    return totalBytes;
}

function getStorageUsagePercent() {
    const used = calculateStorageUsed();
    return (used / USER_STORAGE_LIMIT_BYTES) * 100;
}

function formatBytes(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
}

function updateStorageDisplay() {
    const used = calculateStorageUsed();
    const percent = (used / USER_STORAGE_LIMIT_BYTES) * 100;
    
    const textEl = document.getElementById('storageUsageText');
    const barEl = document.getElementById('storageUsageBar');
    
    if (textEl) {
        textEl.textContent = `${formatBytes(used)} / ${USER_STORAGE_LIMIT_MB} MB (${percent.toFixed(1)}%)`;
    }
    
    if (barEl) {
        barEl.style.width = Math.min(percent, 100) + '%';
        
        // Color based on usage
        if (percent >= 100) {
            barEl.style.background = 'var(--error)';
        } else if (percent >= STORAGE_WARNING_THRESHOLD * 100) {
            barEl.style.background = 'var(--warning, #f59e0b)';
        } else {
            barEl.style.background = 'var(--root-green)';
        }
    }
}

function checkStorageAndWarn() {
    const percent = getStorageUsagePercent();
    
    if (percent >= 100) {
        showStorageFullModal();
        return false; // Storage full
    } else if (percent >= STORAGE_WARNING_THRESHOLD * 100) {
        // Show warning if not already shown in this session
        const warned = sessionStorage.getItem('storage_warning_shown');
        if (!warned) {
            showStorageWarningModal(percent);
            sessionStorage.setItem('storage_warning_shown', 'true');
        }
    }
    return true; // OK to proceed
}

function canAddData(additionalBytes) {
    const currentUsed = calculateStorageUsed();
    const newTotal = currentUsed + additionalBytes;
    return newTotal <= USER_STORAGE_LIMIT_BYTES;
}

function handleNoteImageSelect(event) {
    const fileList = event.target.files;
    if (!fileList.length) return;
    
    // CRITICAL: Copy files to array BEFORE clearing input
    const files = Array.from(fileList);
    
    // Clear input immediately so same file can be selected again
    event.target.value = '';
    
    // Check storage before adding
    if (!checkStorageAndWarn()) {
        toast('Storage full - delete files first', 'error');
        return;
    }
    
    // Show full-screen upload overlay
    showUploadOverlay('Processing images...', 0, files.length);
    
    let processed = 0;
    const total = files.length;
    
    // Process files one at a time with delays to prevent freezing
    const processNextFile = (index) => {
        if (index >= files.length) {
            hideUploadOverlay();
            renderNoteImagePreviews();
            checkStorageAndWarn();
            toast(`${tempNoteImages.length} image(s) ready`, 'success');
            return;
        }
        
        const file = files[index];
        
        // Check file type
        if (!file.type.startsWith('image/')) {
            toast('Please select an image file', 'error');
            processed++;
            updateUploadOverlay('Processing images...', processed, total);
            setTimeout(() => processNextFile(index + 1), 50);
            return;
        }
        
        updateUploadOverlay(`Processing image ${index + 1} of ${total}...`, processed, total);
        
        // Use setTimeout to prevent UI blocking
        setTimeout(() => {
            compressImageAsync(file, 1200, 0.7).then(compressedData => {
                // Check if this image would exceed storage
                if (!canAddData(compressedData.length)) {
                    toast('Not enough storage for this image', 'error');
                } else {
                    tempNoteImages.push({
                        data: compressedData,
                        name: file.name,
                        addedAt: new Date().toISOString()
                    });
                }
                
                processed++;
                updateUploadOverlay('Processing images...', processed, total);
                setTimeout(() => processNextFile(index + 1), 50);
            }).catch(err => {
                console.error('Image processing error:', err);
                toast('Error processing image: ' + (err.message || 'Unknown error'), 'error');
                processed++;
                updateUploadOverlay('Processing images...', processed, total);
                setTimeout(() => processNextFile(index + 1), 50);
            });
        }, 100);
    };
    
    // Start processing
    setTimeout(() => processNextFile(0), 100);
}

// Async image compression that won't freeze the UI
function compressImageAsync(file, maxWidth, quality) {
    return new Promise((resolve, reject) => {
        // Create object URL instead of reading entire file first
        const objectUrl = URL.createObjectURL(file);
        const img = new Image();
        
        img.onerror = () => {
            URL.revokeObjectURL(objectUrl);
            reject(new Error('Failed to load image'));
        };
        
        img.onload = function() {
            try {
                URL.revokeObjectURL(objectUrl);
                
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;
                
                // Scale down if larger than maxWidth
                if (width > maxWidth) {
                    height = Math.round((height * maxWidth) / width);
                    width = maxWidth;
                }
                
                // Also limit height
                if (height > maxWidth) {
                    width = Math.round((width * maxWidth) / height);
                    height = maxWidth;
                }
                
                canvas.width = width;
                canvas.height = height;
                
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                
                // Convert to JPEG for better compression
                const compressed = canvas.toDataURL('image/jpeg', quality);
                
                resolve(compressed);
            } catch (err) {
                reject(err);
            }
        };
        
        img.src = objectUrl;
    });
}

function saveNote(editIndex = null) {
    const title = document.getElementById('noteTitle')?.value?.trim() || '';
    const content = document.getElementById('noteContent')?.value?.trim() || '';
    const source = document.getElementById('noteSource')?.value || '';
    
    if (!content && !tempNoteImages.length) {
        toast('Please enter some content or add an image', 'error');
        return;
    }
    
    const notes = JSON.parse(localStorage.getItem('rooted_notes') || '[]');
    
    // Get existing images if editing
    const existingImages = editIndex !== null ? (notes[editIndex]?.images || []) : [];
    
    const note = {
        title,
        content,
        source,
        images: [...existingImages, ...tempNoteImages],
        date: new Date().toLocaleDateString()
    };
    
    if (editIndex !== null) {
        notes[editIndex] = note;
    } else {
        notes.unshift(note);
    }
    
    localStorage.setItem('rooted_notes', JSON.stringify(notes));
    tempNoteImages = [];
    closeModal();
    toast('Note saved! 📝', 'success');
    render();
}

    if (tool.type === 'internal') {

}

// Save tool session to history for revisiting
function saveToolHistory(toolId, hasResults = false, sessionId = null) {
    const history = JSON.parse(localStorage.getItem('rooted_tool_history') || '[]');
    
    const entry = {
        toolId,
        sessionId: sessionId || Date.now().toString(),
        date: new Date().toLocaleDateString(),
        timestamp: Date.now(),
        hasResults
    };
    
    // Remove old entries for same tool (keep latest)
    const filtered = history.filter(h => h.toolId !== toolId);
    filtered.unshift(entry);
    
    // Keep only last 20 entries
    localStorage.setItem('rooted_tool_history', JSON.stringify(filtered.slice(0, 20)));
}

function calculateStreak(activityDays) {
    if (!activityDays.length) return 0;
    
    const today = new Date().toISOString().split('T')[0];
    const sorted = [...activityDays].sort((a, b) => new Date(b) - new Date(a));
    
    let streak = 0;
    let currentDate = new Date(today);
    
    for (const day of sorted) {
        const dayDate = new Date(day).toISOString().split('T')[0];
        const checkDate = currentDate.toISOString().split('T')[0];
        
        if (dayDate === checkDate) {
            streak++;
            currentDate.setDate(currentDate.getDate() - 1);
        } else {
            break;
        }
    }
    
    return streak;
}

function updateWeeklyChart(checkIns, toolUsage) {
    const today = new Date();
    const dayOfWeek = today.getDay();
    
    // Get activity for each day of the week
    for (let i = 0; i < 7; i++) {
        const date = new Date(today);
        date.setDate(today.getDate() - dayOfWeek + i);
        const dateStr = date.toISOString().split('T')[0];
        
        // Count activities on this day
        const checkInsOnDay = checkIns.filter(c => c.date === dateStr).length;
        const toolsOnDay = Object.values(toolUsage).filter(t => t.lastUsed?.split('T')[0] === dateStr).length;
        const total = checkInsOnDay + toolsOnDay;
        
        const bar = document.getElementById(`bar${i}`);
        if (bar) {
            const height = Math.min(total * 25 + 10, 100);
            bar.style.height = `${height}px`;
            bar.style.background = total > 0 ? 'linear-gradient(135deg,var(--root-green),var(--leaf-green))' : 'var(--hover-bg)';
        }
    }
}

// Track tool usage
function trackToolUsage(toolId) {
    const toolUsage = JSON.parse(localStorage.getItem('rooted_tool_usage') || '{}');
    if (!toolUsage[toolId]) {
        toolUsage[toolId] = { count: 0 };
    }
    toolUsage[toolId].count++;
    toolUsage[toolId].lastUsed = new Date().toISOString();
    localStorage.setItem('rooted_tool_usage', JSON.stringify(toolUsage));
    
    // Track activity day
    const activityDays = JSON.parse(localStorage.getItem('rooted_activity_days') || '[]');
    const today = new Date().toISOString().split('T')[0];
    if (!activityDays.includes(today)) {
        activityDays.push(today);
        localStorage.setItem('rooted_activity_days', JSON.stringify(activityDays));
    }
}

async function loadUserProfileData() {
    if (!Auth.currentUser || !firebaseInitialized) return;
    
    try {
        const doc = await db.collection('users').doc(Auth.currentUser.uid).get();
        if (doc.exists) {
            const data = doc.data();
            
            // Fill in profile fields
            if (data.phone) document.getElementById('profilePhone').value = data.phone;
            if (data.address) document.getElementById('profileAddress').value = data.address;
            if (data.city) document.getElementById('profileCity').value = data.city;
            if (data.state) document.getElementById('profileState').value = data.state;
            if (data.zip) document.getElementById('profileZip').value = data.zip;
            
            // Display membership status (read-only)
            const statusIcon = document.getElementById('memberStatusIcon');
            const statusText = document.getElementById('memberStatusText');
            const statusSubtext = document.getElementById('memberStatusSubtext');
            const nonMemberSection = document.getElementById('nonMemberSection');
            const statusDisplay = document.getElementById('memberStatusDisplay');
            
            if (statusIcon && statusText) {
                if (data.isMember === true) {
                    statusIcon.textContent = '✅';
                    statusText.textContent = 'You are a Member';
                    statusSubtext.textContent = 'Your membership has been confirmed by your church.';
                    statusDisplay.style.background = 'linear-gradient(135deg, rgba(34, 197, 94, 0.15), rgba(22, 163, 74, 0.1))';
                    statusDisplay.style.border = '1px solid rgba(34, 197, 94, 0.3)';
                    if (nonMemberSection) nonMemberSection.style.display = 'none';
                } else {
                    statusIcon.textContent = '👤';
                    statusText.textContent = 'Attendee';
                    statusSubtext.textContent = 'You are connected but not yet a confirmed member.';
                    statusDisplay.style.background = 'var(--hover-bg)';
                    statusDisplay.style.border = 'none';
                    if (nonMemberSection) nonMemberSection.style.display = 'block';
                }
            }
        }
    } catch (e) {
        console.error('Error loading profile:', e);
    }
}

async function showMembershipInterest(churchId) {
    const church = await ChurchDB.getChurchFresh(churchId);
    const membershipConfig = church?.membershipConfig || {};
    const methods = Array.isArray(membershipConfig.methods) ? membershipConfig.methods : [];
    
    let content = '';
    
    // Build content based on selected methods
    if (methods.length > 0) {
        content = '<p style="margin-bottom:var(--space-lg)">Choose how you\'d like to connect with us:</p>';
        
        if (methods.includes('email') && membershipConfig.email) {
            content += `
                <a href="mailto:${membershipConfig.email}?subject=Membership Interest at ${church?.name || 'Church'}" style="display:flex;align-items:center;gap:var(--space-md);padding:var(--space-md);background:var(--hover-bg);border-radius:var(--radius-md);margin-bottom:var(--space-sm);color:var(--text-primary);text-decoration:none">

                        <strong>Email Us</strong>
                        <p style="font-size:0.85rem;color:var(--text-secondary);margin:0">${membershipConfig.email}</p>
                    </div>
                </a>
            `;
        }
        
        if (methods.includes('url') && membershipConfig.url) {
            content += `
                <a href="${membershipConfig.url}" target="_blank" style="display:flex;align-items:center;gap:var(--space-md);padding:var(--space-md);background:var(--hover-bg);border-radius:var(--radius-md);margin-bottom:var(--space-sm);color:var(--text-primary);text-decoration:none">
                    <span style="font-size:1.5rem">🌐</span>
                    <div style="flex:1">
                        <strong>Visit Website</strong>
                        <p style="font-size:0.85rem;color:var(--text-secondary);margin:0">Learn more online</p>
                    </div>
                </a>
            `;
        }
        
        if (methods.includes('phone') && membershipConfig.phone) {
            content += `
                <a href="tel:${membershipConfig.phone.replace(/\D/g, '')}" style="display:flex;align-items:center;gap:var(--space-md);padding:var(--space-md);background:var(--hover-bg);border-radius:var(--radius-md);margin-bottom:var(--space-sm);color:var(--text-primary);text-decoration:none">
                    <span style="font-size:1.5rem">📞</span>
                    <div style="flex:1">
                        <strong>Call Us</strong>
                        <p style="font-size:0.85rem;color:var(--text-secondary);margin:0">${membershipConfig.phone}</p>
                    </div>
                </a>
            `;
        }
    } else {
        // Fallback if no methods configured
        content = `
            <p style="margin-bottom:var(--space-lg)">Contact the church directly to learn about becoming a member.</p>
            ${church?.phone ? `<p style="margin-bottom:var(--space-sm)">📞 ${church.phone}</p>` : ''}
            ${church?.website ? `<a href="${church.website}" target="_blank" class="btn btn-primary btn-block">🌐 Visit Church Website</a>` : ''}
        `;
    }
    
    showModal(`
        <div class="modal" onclick="event.stopPropagation()" style="max-width:400px">
            <div class="modal-header">
                <h3 class="modal-title">✨ Become a Member</h3>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body">
                <div style="text-align:center;margin-bottom:var(--space-lg)">
                    <div style="font-size:3rem;margin-bottom:var(--space-md)">⛪</div>
                    <h4>${church?.name || 'Church'}</h4>

    `);

async function saveProfile() {
    const firstName = document.getElementById('profileFirstName')?.value?.trim() || '';
    const lastName = document.getElementById('profileLastName')?.value?.trim() || '';
    const phone = document.getElementById('profilePhone')?.value?.trim() || '';
    const address = document.getElementById('profileAddress')?.value?.trim() || '';
    const city = document.getElementById('profileCity')?.value?.trim() || '';
    const state = document.getElementById('profileState')?.value?.trim() || '';
    const zip = document.getElementById('profileZip')?.value?.trim() || '';
    
    const name = `${firstName} ${lastName}`.trim();
    
    if (!name) { 
        toast('Name is required', 'error'); 
        return; 
    }
    
    try {
        // Update auth profile
        await Auth.updateProfile({ name, displayName: name });
        
        // Save extended profile to Firestore (do NOT include isMember - that's admin controlled)
        if (firebaseInitialized && Auth.currentUser) {
            await db.collection('users').doc(Auth.currentUser.uid).set({
                name,
                phone,
                address,
                city,
                state,
                zip,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
        }
        
        toast('Profile updated! ✓', 'success');
        render();
    } catch (e) {
        console.error('Error saving profile:', e);
        toast('Error saving profile', 'error');
    }
}

async function changePassword() {
    const currentPassword = document.getElementById('currentPassword')?.value || '';
    const newPassword = document.getElementById('newPassword')?.value || '';
    const confirmPassword = document.getElementById('confirmPassword')?.value || '';
    
    if (!currentPassword || !newPassword || !confirmPassword) {
        toast('Please fill in all password fields', 'error');
        return;
    }
    
    if (newPassword !== confirmPassword) {
        toast('New passwords do not match', 'error');
        return;
    }
    
    if (newPassword.length < 6) {
        toast('Password must be at least 6 characters', 'error');
        return;
    }
    
    try {
        const user = auth.currentUser;
        const credential = firebase.auth.EmailAuthProvider.credential(user.email, currentPassword);
        
        // Re-authenticate
        await user.reauthenticateWithCredential(credential);
        
        // Update password
        await user.updatePassword(newPassword);
        
        toast('Password updated successfully! ✓', 'success');
        
        // Clear fields
        document.getElementById('currentPassword').value = '';
        document.getElementById('newPassword').value = '';
        document.getElementById('confirmPassword').value = '';
    } catch (e) {
        console.error('Error changing password:', e);
        if (e.code === 'auth/wrong-password') {
            toast('Current password is incorrect', 'error');
        } else {
            toast('Error updating password: ' + e.message, 'error');
        }
    }
}

function applyUserTheme() {
    const prefs = JSON.parse(localStorage.getItem('rooted_user_prefs') || '{}');
    const root = document.documentElement;
    
    // Get seasonal colors if set
    const seasonColors = {
        spring: { primary: '#f472b6', secondary: '#c084fc' },
        summer: { primary: '#f59e0b', secondary: '#fbbf24' },
        fall: { primary: '#ea580c', secondary: '#f97316' },
        winter: { primary: '#3b82f6', secondary: '#60a5fa' }
    };
    
    let primaryColor = '#16a34a'; // Default green
    let secondaryColor = '#22c55e';
    
    // Priority: User seasonal > User custom color > Church theme > Default
    if (prefs.seasonalTheme && seasonColors[prefs.seasonalTheme]) {
        primaryColor = seasonColors[prefs.seasonalTheme].primary;
        secondaryColor = seasonColors[prefs.seasonalTheme].secondary;
    } else if (prefs.useCustomColor && prefs.accentColor) {
        primaryColor = prefs.accentColor;
        secondaryColor = prefs.accentColor;
    } else if (prefs.useChurchTheme !== false) {
        const userChurchId = Auth.currentUser ? getUserChurch(Auth.currentUser.uid) : null;
        const userChurch = userChurchId ? getChurchData(userChurchId) : null;
        if (userChurch?.branding?.primaryColor) {
            primaryColor = userChurch.branding.primaryColor;
            secondaryColor = userChurch.branding.secondaryColor || primaryColor;
        }
    }
    
    root.style.setProperty('--root-green', primaryColor);
    root.style.setProperty('--leaf-green', secondaryColor);
}

// Apply theme on load
document.addEventListener('DOMContentLoaded', applyUserTheme);

function useMyLocation() {
    const results = document.getElementById('churchSearchResults');
    
    if (!navigator.geolocation) {
        toast('Geolocation is not supported by your browser', 'error');
        return;
    }
    
    results.innerHTML = `
        <div style="text-align:center;padding:var(--space-lg)">
            <div class="loading-spinner" style="margin:0 auto var(--space-md)"></div>
            <p style="color:var(--text-secondary)">Getting your location...</p>
        </div>
    `;
    
    navigator.geolocation.getCurrentPosition(
        async (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            
            // Get all churches and calculate distance
            const allChurches = await ChurchDB.getAllChurches();
            const withDistance = allChurches.map(church => {
                if (church.latitude && church.longitude) {
                    const dist = calculateDistance(lat, lng, church.latitude, church.longitude);
                    return { ...church, distance: dist };
                }
                return { ...church, distance: 999999 };
            }).sort((a, b) => a.distance - b.distance);
            
            displayChurchResults(withDistance, true);
        },
        (error) => {
            toast('Could not get your location: ' + error.message, 'error');
            results.innerHTML = '<p style="color:var(--error);text-align:center">Could not get your location. Please enter it manually.</p>';
        },
        { enableHighAccuracy: true }
    );
}

function calculateDistance(lat1, lng1, lat2, lng2) {
    // Haversine formula
    const R = 3959; // Earth's radius in miles
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLng/2) * Math.sin(dLng/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
}

async function selectChurch(churchId) {
    if (!Auth.currentUser) {
        toast('Please sign in first', 'error');
        return;
    }
    
    // Show loading
    toast('Connecting to church...', 'info');
    
    try {
        const result = await UserChurchDB.addChurch(Auth.currentUser.uid, churchId);
        
        if (result === true) {
            // Set as active church
            await UserChurchDB.setActiveChurch(Auth.currentUser.uid, churchId);
            
            // Clear cache to force fresh data load
            delete churchCache[churchId];
            
            // Load fresh church data from Firebase
            await ChurchDB.getChurchFresh(churchId);
            
            // Reload user data
            await loadUserChurchData();
            
            closeModal();
            toast('Successfully connected to church! ⛪', 'success');
            
            // Navigate to My Church page
            navigate('my-church');
        } else if (result && result.error) {
            toast(result.message, 'error');
        } else {
            toast('Could not connect to church. Please try again.', 'error');
        }
    } catch (e) {
        console.error('Error selecting church:', e);
        toast('Error connecting to church: ' + e.message, 'error');
    }
}

    try {

            // Re-render if still on expected page

                render();
            }
        }
    } catch (e) {
        console.error('Error loading church data:', e);

async function ensureChurchDataLoaded(churchId) {
    if (!churchId) return null;
    
    // If not in cache, load from Firebase
    if (!churchCache[churchId]) {
        try {
            const church = await ChurchDB.getChurchFresh(churchId);
            if (church) {
                churchCache[churchId] = church;
            }
            return church;
        } catch (e) {
            console.error('Error loading church:', e);
            return null;
        }
    }
    
    return churchCache[churchId];
}

// Continue Watching - localStorage functions
function getContinueWatching(churchId) {
    try {
        const history = JSON.parse(localStorage.getItem('rooted_watch_history') || '{}');
        return (history[churchId] || []).slice(0, 10);
    } catch (e) {
        return [];
    }
}

function addToWatchHistory(videoId, title, churchId) {
    try {
        const history = JSON.parse(localStorage.getItem('rooted_watch_history') || '{}');
        if (!history[churchId]) history[churchId] = [];
        
        // Remove if already exists
        history[churchId] = history[churchId].filter(h => h.videoId !== videoId);
        
        // Add to front
        history[churchId].unshift({
            videoId,
            title,
            timestamp: Date.now()
        });
        
        // Keep only last 20
        history[churchId] = history[churchId].slice(0, 20);
        
        localStorage.setItem('rooted_watch_history', JSON.stringify(history));
    } catch (e) {
        console.error('Error saving watch history:', e);
    }
}

// Save video progress when user stops watching
function saveVideoProgress(videoId, churchId, currentTime, duration) {
    try {
        const progress = JSON.parse(localStorage.getItem('rooted_video_progress') || '{}');
        if (!progress[churchId]) progress[churchId] = {};
        
        // Only save if watched more than 10 seconds and not near the end
        if (currentTime > 10 && currentTime < duration - 30) {
            progress[churchId][videoId] = {
                time: Math.floor(currentTime),
                duration: Math.floor(duration),
                savedAt: Date.now()
            };
        } else if (currentTime >= duration - 30) {
            // Near the end, remove progress (completed)
            delete progress[churchId][videoId];
        }
        
        localStorage.setItem('rooted_video_progress', JSON.stringify(progress));
    } catch (e) {
        console.error('Error saving video progress:', e);
    }
}

// Get saved progress for a video
function getVideoProgress(videoId, churchId) {
    try {
        const progress = JSON.parse(localStorage.getItem('rooted_video_progress') || '{}');
        const videoProgress = progress[churchId]?.[videoId];
        
        // Only return if saved within last 30 days
        if (videoProgress && Date.now() - videoProgress.savedAt < 30 * 24 * 60 * 60 * 1000) {
            return videoProgress;
        }
        return null;
    } catch (e) {
        return null;
    }
}

// Track current playing video for saving progress
let currentPlayingVideo = null;

function playAndTrackVideo(videoId, title, churchId) {
    addToWatchHistory(videoId, title, churchId);
    const progress = getVideoProgress(videoId, churchId);
    playYouTubeVideo(videoId, title, churchId, progress?.time || 0);
}

// Filter videos function
function filterVideos(filter) {
    document.querySelectorAll('.video-filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === filter);
    });
    
    document.querySelectorAll('.video-row').forEach(row => {
        if (filter === 'all') {
            row.style.display = '';
        } else if (filter.startsWith('playlist_')) {
            const playlistId = filter.replace('playlist_', '');
            row.style.display = (row.dataset.playlist === playlistId || row.dataset.playlist === 'continue') ? '' : 'none';
        }
    });
}

        summer: { primary: '#f59e0b', secondary: '#fbbf24' },
        fall: { primary: '#ea580c', secondary: '#f97316' },
        winter: { primary: '#3b82f6', secondary: '#60a5fa' }
    };
    
    if (season && seasonPalettes[season]) {

    return {

// Play YouTube video in modal with resume support
function playYouTubeVideo(videoId, title, churchId = null, startTime = 0) {
    currentPlayingVideo = { videoId, title, churchId };
    
    // Build embed URL with start time
    let embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1&enablejsapi=1`;
    if (startTime > 0) {
        embedUrl += `&start=${startTime}`;
    }
    
    showModal(`
        <div class="modal" onclick="event.stopPropagation()" style="max-width:800px;width:95%">
            <div class="modal-header">
                <h3 class="modal-title">${title}</h3>
                <button class="modal-close" onclick="handleVideoClose()">✕</button>
            </div>
            <div class="modal-body" style="padding:0">
                ${startTime > 0 ? `<div style="background:var(--root-green);color:white;padding:8px 16px;font-size:0.85rem">▶️ Resuming from ${formatVideoTime(startTime)}</div>` : ''}
                <div style="position:relative;padding-bottom:56.25%;height:0">
                    <iframe id="ytPlayer" src="${embedUrl}" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0" allow="autoplay;encrypted-media" allowfullscreen></iframe>
                </div>
            </div>
        </div>
    `);
    
    // Try to track progress using YouTube API
    initYouTubeProgressTracking(videoId, churchId);
}

// Format seconds to mm:ss
function formatVideoTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${mins}:${secs.toString().padStart(2, '0')}`;
}

// Handle video close - save progress
function handleVideoClose() {
    // Try to get current time from iframe (may not work due to cross-origin)
    const iframe = document.getElementById('ytPlayer');
    if (iframe && currentPlayingVideo?.churchId) {
        // Use a polling approach or postMessage to get current time
        // For now, we'll save progress when they manually save
    }
    currentPlayingVideo = null;
    closeModal();
}

// Initialize YouTube progress tracking
function initYouTubeProgressTracking(videoId, churchId) {
    if (!churchId) return;
    
    // Poll for progress using postMessage (works with some limitations)
    let progressInterval = setInterval(() => {
        const iframe = document.getElementById('ytPlayer');
        if (!iframe || !document.querySelector('.modal')) {
            clearInterval(progressInterval);
            return;
        }
        
        // Try to get time via YouTube API (if player is ready)
        try {
            iframe.contentWindow.postMessage('{"event":"command","func":"getCurrentTime","args":""}', '*');
        } catch (e) {}
    }, 5000);
    
    // Listen for messages from YouTube
    const messageHandler = (event) => {
        if (event.origin !== 'https://www.youtube.com') return;
        try {
            const data = JSON.parse(event.data);
            if (data.info && typeof data.info.currentTime === 'number' && typeof data.info.duration === 'number') {
                saveVideoProgress(videoId, churchId, data.info.currentTime, data.info.duration);
            }
        } catch (e) {}
    };
    
    window.addEventListener('message', messageHandler);
    
    // Cleanup when modal closes
    const checkModal = setInterval(() => {
        if (!document.querySelector('.modal')) {
            clearInterval(progressInterval);
            clearInterval(checkModal);
            window.removeEventListener('message', messageHandler);
        }
    }, 1000);
}
